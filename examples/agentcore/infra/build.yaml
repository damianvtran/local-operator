AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Local Operator on Amazon Bedrock AgentCore - image build stack. An ECR
  repository for the runtime image, a private S3 bucket for the build context
  and an arm64 CodeBuild project that builds and pushes the image.

# Why the image is built in CodeBuild rather than on the caller's machine:
# AgentCore Runtime only runs linux/arm64 images. An arm64 CodeBuild host
# builds natively, so a user needs neither a local Docker daemon nor a
# QEMU cross-build. deploy.sh uploads app/ as a zip and starts one build.
#
# Nothing account- or organisation-specific lives here: every name derives
# from the stack name, and the bucket name is generated by CloudFormation.

Parameters:
  ProjectName:
    Type: String
    Description: Prefix for resource names (deploy.sh passes the base stack name).
    AllowedPattern: "[a-z][a-z0-9-]{1,40}"
    ConstraintDescription: lowercase letters, digits and hyphens, starting with a letter.

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Build contexts are only needed for the duration of a build.
      LifecycleConfiguration:
        Rules:
          - Id: expire-build-contexts
            Status: Enabled
            ExpirationInDays: 7

  SourceBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub "${SourceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}"
      ImageScanningConfiguration:
        ScanOnPush: true
      # Tags are content hashes (deploy.sh); a pushed tag never changes meaning.
      ImageTagMutability: IMMUTABLE
      # Teardown deletes images with the repository.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "keep the 10 newest images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadBuildContext
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${SourceBucket.Arn}/*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Sid: BuildLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-image*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-image"
      Description: Builds the Local Operator AgentCore runtime image (linux/arm64).
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        # Native arm64: the image AgentCore Runtime requires, without emulation.
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        # Docker-in-CodeBuild needs privileged mode.
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt Repository.RepositoryUri
          # Overridden per build by deploy.sh.
          - Name: IMAGE_TAG
            Value: latest
          - Name: LOP_VERSION
            Value: "0.92.1"
      Source:
        Type: S3
        # deploy.sh overrides the object key per build.
        Location: !Sub "${SourceBucket}/build-context.zip"
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              on-failure: ABORT
              commands:
                - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
            build:
              on-failure: ABORT
              commands:
                - docker build --build-arg LOP_VERSION="$LOP_VERSION" -t "$REPOSITORY_URI:$IMAGE_TAG" .
                # Proves the image carries the requested lop release before it ships.
                - docker run --rm --entrypoint python "$REPOSITORY_URI:$IMAGE_TAG" -c "from importlib.metadata import version; v = version('local-operator'); print('local-operator', v); assert v == '$LOP_VERSION'"
            post_build:
              on-failure: ABORT
              commands:
                - docker push "$REPOSITORY_URI:$IMAGE_TAG"

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
  SourceBucketName:
    Value: !Ref SourceBucket
  BuildProjectName:
    Value: !Ref BuildProject
