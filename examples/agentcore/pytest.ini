# Makes this directory its own pytest root, so `pytest examples/agentcore/tests`
# does not pick up the repository's pyproject options (xdist flags) or its root
# conftest.py (which imports the checkout's test helpers). The example is tested
# against a released local-operator from PyPI, independently of the checkout.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider
