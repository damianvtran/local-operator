[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-operator"
version = "0.49.5"
description = "A team of proactive AI assistants that can work together behind the scenes to help you get mundane tasks done so you can focus on the fun stuff."
readme = "README.md"
authors = [{ name = "Damian Tran", email = "damian@gominerva.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["local", "agent", "execution", "operator", "agent-to-agent", "agentic", "local-first", "ai", "proactive"]
# The default install is deliberately small: the core agent (exec mode,
# provider clients, the tool loop, and the terminal UI) and nothing else.
# Everything with a heavy or platform-fragile footprint sits behind an extra
# below. Adding a dependency here is a decision about every user's install
# time, and on Windows about whether a compiled wheel exists at all.
dependencies = [
    # HTTP + data model. httpx drives every provider client and the OAuth
    # flows; pydantic is the schema layer the whole harness is typed against.
    "httpx>=0.27",
    "pydantic>=2.7",
    # PEP 696 TypeVar defaults are used in harness/types.py and only reached
    # typing in 3.13, while we support 3.12. Declared explicitly rather than
    # leaned on as a pydantic transitive, because an import in our own module
    # graph fails at import time if it goes missing.
    "typing-extensions>=4.6",
    # requests backs the legacy synchronous service clients (Radient, Ollama,
    # OpenRouter model listings) and model validation. Pure Python itself, but
    # note it pulls charset-normalizer, which DOES ship a compiled accelerator
    # (with a pure-Python fallback, so it degrades rather than building).
    "requests>=2.32.0",
    # Configuration and persistence: agent.yml / config.yml, skill front
    # matter, and .env loading. pyyaml ships a compiled libyaml accelerator
    # and publishes no pure-Python wheel, so it is the one remaining package
    # in the default set that can hit an sdist build on a platform/CPython
    # combination it has not published for.
    "pyyaml",
    "python-dotenv",
    # Terminal UI. This is the default entry point of the `local-operator`
    # command, so it stays required rather than optional. Pure Python, no
    # compiled wheels — textual pulls rich, which pulls pygments and
    # markdown-it-py. pygments is listed explicitly because the TUI imports
    # it directly for syntax token styling.
    "textual>=8.0.0",
    "rich>=13.7",
    "pygments>=2.13",
    # The desktop UI's installer runs a BARE `pip install local-operator` and
    # then launches `local-operator serve`, so the default set must stay fully
    # functional (0.15.10 had these in base; splitting them into extras broke
    # every already-shipped UI against 0.16.0). The [server]/[mcp]/[images]/
    # [tokenizer] extras remain as aliases for hosts that install by name.
    "fastapi",
    "starlette",
    "uvicorn",
    "python-multipart",
    # The personal tunnel gateway verifies the edge's RSA proof locally;
    # declare this directly rather than relying on the MCP transitive copy.
    "pyjwt[crypto]>=2.10,<3",
    "websockets>=15.0.1",
    "apscheduler",
    "dill",
    "tiktoken",
    "mcp>=1.2",
    "pillow-heif",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# The HTTP API facade (local-operator serve) and the background scheduler it
# owns. fastapi/starlette/uvicorn/websockets/python-multipart are pure Python
# but total ~10 packages, and none of them are reachable from exec mode or
# the TUI. dill is here too: only the server's agent-context endpoints pickle
# execution namespaces. tiktoken is here because the /v1/chat routes report
# token stats in their responses: the code degrades to the chars/4 estimate
# without it, but an HTTP API returning approximate counts is a worse default
# than paying for one wheel on a host that already opted into a web server.
server = [
    "fastapi",
    "starlette",
    "uvicorn",
    "python-multipart",
    "websockets>=15.0.1",
    "apscheduler",
    "dill",
    "tiktoken",
]
# Model Context Protocol client support. The SDK's own chain is the single
# heaviest thing this project can install: a TLS stack (cryptography, via
# pyjwt[crypto]), a JSON Schema validator with a Rust-backed store, an
# OpenTelemetry API, an ASGI server, and the entire pywin32 bundle on Windows.
mcp = ["mcp>=1.2"]
# HEIC/HEIF image attachment decoding. Both wheels are compiled, and
# pillow-heif in particular is the most likely thing to have no wheel for a
# freshly released CPython on Windows.
images = ["pillow-heif"]
# Exact BPE token counting for context management. A compiled (Rust) wheel
# that also downloads its rank tables on first use; without it token
# estimation falls back to a chars/4 heuristic and compaction still works.
tokenizer = ["tiktoken"]
# Symbol-aware Python navigation for the `lsp` tool. jedi is pure Python and
# answers in-process — the only LSP shape with no server subprocess to
# install, spawn or babysit, which is why it can be an opt-in extra at all
# rather than a base dependency.
lsp = ["jedi>=0.19"]
# Clean HTML→markdown rendering for web_fetch. markdownify and its transitive
# deps (beautifulsoup4, soupsieve) are ALL pure Python with no compiled wheels,
# so this is safe to fold into `all` without the Windows sdist-build fragility
# the other extras are kept lean to avoid. web_fetch degrades SILENTLY to a
# stdlib html.parser renderer when this extra is absent, so a bare install stays
# fully functional — the extra only upgrades render quality.
fetch = ["markdownify"]
all = ["local-operator[server,mcp,images,tokenizer,fetch]"]
dev = [
    "local-operator[all]",
    # PINNED TO THE VERSION CI RUNS (`.github/workflows/ci.yml` lint job). The
    # documented gate — `.venv/bin/python -m flake8 .` in AGENTS.md, `make lint`
    # in the Makefile — used to fail with `No module named flake8` on a fresh
    # venv, because the dev extra shipped `ruff` instead while every other
    # reference in the repo (CI, Makefile, CONTRIBUTING, SECURITY, the PR
    # template) named flake8. `ruff` was invoked by nothing: no CI step, no make
    # target, no `[tool.ruff]` config. A lint gate you cannot run locally is one
    # you first meet as a red CI job, so the dev extra installs the real one and
    # the unused one is gone (R1-2, agent review round 1).
    #
    # Unpinned it would drift from CI: a newer pycodestyle can flag code CI
    # accepts, or accept code CI flags, and either way the local gate stops
    # predicting the remote one. Bump this and the ci.yml pin together.
    "flake8==7.3.0",
    # Same discipline as flake8: one version across the type-check job,
    # the local gate, and this extra. Unpinned, the wrapper
    # (PYRIGHT_PYTHON_FORCE_VERSION=latest used to live on the type-check
    # job) downloaded whatever npm called latest (1.1.413) while pip
    # resolved 1.1.411 and the lint job — which never even ran pyright —
    # pinned 1.1.408. The restated `[tool.pyright] exclude` defaults are
    # version-specific; three versions means the restatement is a guess.
    # Bump this pin, not an env override, and keep the exclude-superset
    # guard in tests/unit/test_ci_hygiene.py green against the new
    # analyzer.
    "pyright==1.1.411",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Distributes the suite across worker processes (`pytest -n`). The suite is
    # overwhelmingly wait-bound — Textual pilot tests spend their wall time
    # letting the event loop settle, not on CPU — so parallelism cuts CI wall
    # time roughly linearly with the runner's core count while leaving total
    # CPU work unchanged. See the `-n auto` note on `addopts` below.
    "pytest-xdist",
    "pytest-textual-snapshot",
    # Capture glyph origins must follow grapheme clusters, not codepoints.
    "regex>=2024.11.6",
    "pip-audit",
    # Independent decoder used to verify our own PNG encoder's output.
    "pillow",
    # Direct, not via the lsp extra: CI installs dev and must exercise the
    # optional tool's suite, while `all` stays lean for end users.
    "jedi>=0.19",
    # The OSWorld adapter's AWS provider (benchmarks/osworld_v2_adapter) is a
    # SEPARATE distribution that depends on boto3; the harness itself never
    # imports it. Its unit tests still live under tests/ and drive the
    # provider against botocore's Stubber, so the dev extra carries boto3 for
    # the test interpreter only. Keeping it out of `all` is deliberate: an end
    # user who never runs a benchmark should not install an AWS SDK.
    "boto3>=1.34",
]

# Explicit package discovery. Without this, setuptools falls back to
# flat-layout AUTO-discovery, which walks the repo root, finds both
# `local_operator/` and `static/` (image assets, no __init__.py) and refuses
# with "Multiple top-level packages discovered in a flat-layout". The deleted
# setup.py used to supply `packages=find_packages()`, which is what suppressed
# auto-discovery; pyproject has to say it explicitly now. `pip install .`
# fails outright without this, so it is load-bearing, not tidiness.
[tool.setuptools.packages.find]
include = ["local_operator*"]

[tool.setuptools.package-data]
local_operator = [
    "prompts_md/*.md",
    "guides/*/*.md",
    "tui/*.tcss",
    # Packaged starter role profiles. Without this they are absent from a
    # wheel, and ``task(agent="reviewer")`` silently degrades to an unguided
    # child on every non-source install.
    "agent_seeds/*.md",
    # The macOS notification sender's source and icon. Both must ship: the
    # bundle is compiled on the user's machine on first use (see
    # ``tui/notifier_app``), and without the `.m` there is nothing to build
    # while without the `.icns` the toast wears the generic placeholder
    # instead of the project's mark.
    "tui/notifier_app/notifier.m",
    "tui/notifier_app/icon.icns",
    # The phone control plane's built SPA. The daemon serves it from
    # local_operator/mobile/web/dist/; without this a pip/uv install has
    # no UI and every authed GET answers 503 "bundle not built".
    "mobile/web/dist/*",
    "mobile/web/dist/assets/*",
    # The web SOURCES too: dist/ is gitignored, so a source snapshot (git
    # archive, sdist) has no built bundle, and the dist globs above then match
    # nothing — which used to drop the WHOLE web tree and make the 503
    # unrecoverable (no package.json to rebuild from). Shipping the sources
    # lets the daemon's self-heal (`lop mobile install`) rebuild the bundle on
    # any host with Node; the build inputs (node_modules, lockfile-resolved
    # deps) are never packaged.
    "mobile/web/package.json",
    "mobile/web/pnpm-lock.yaml",
    "mobile/web/pnpm-workspace.yaml",
    "mobile/web/index.html",
    "mobile/web/tsconfig*.json",
    "mobile/web/vite.config.ts",
    "mobile/web/scripts/*.mjs",
    "mobile/web/public/*",
    # setuptools package-data does not recurse with `**` here, so the source
    # tree is enumerated by directory. New src subdirectories need a line.
    "mobile/web/src/*.ts",
    "mobile/web/src/*.tsx",
    "mobile/web/src/components/*.tsx",
    "mobile/web/src/components/ui/*.tsx",
    "mobile/web/src/lib/*.ts",
    "mobile/web/src/screens/*.tsx",
    "mobile/web/src/styles/*.css",
    "mobile/web/src/themes/*.ts",
    # The login page's LO mark, served unauthenticated at /mark.png from
    # mobile/static/. Missing it shows a broken image on sign-in.
    "mobile/static/*",
]

[project.urls]
Homepage = "https://github.com/damianvtran/local-operator"

[project.scripts]
local-operator = "local_operator.cli:main"
# `lop` is the short form every doc, hint and the stable `~/.local/bin/lop`
# launcher already assumes. Registering it here makes a standard
# `pip`/`uv tool install` provide it too, so the session-ended "resume with:"
# hint can name a command that exists without the machine-specific launcher.
# setuptools/pip generate the platform-correct wrapper (console-script shim on
# Unix, .exe launcher on Windows), so the alias is cross-platform by
# construction rather than by a POSIX-only symlink.
lop = "local_operator.cli:main"

[tool.black]
line-length = 100
target-version = ['py312']
# Vendored release helpers stay byte-identical to their recorded upstream SHA.
extend-exclude = "F401|benchmarks/osworld_v2_adapter/src/evaluation_examples/"

[tool.pylint."messages control"]
ignore = ["__init__.py"]
disable = "all"
enable = [
    "empty-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring"
]

[tool.isort]
profile = "black"
extend_skip = ["benchmarks/osworld_v2_adapter/src/evaluation_examples"]

[tool.pyright]
reportMissingTypeArgument = true
strictListInference = true
reportPrivateImportUsage = false
# Benchmark adapters are SEPARATE distributions that the harness deliberately
# does not install (`discovery` pins them by wheel RECORD, so making one part of
# this distribution would put the whole harness inside every adapter's
# `package_digest`). Their tests still live in `tests/`, and CI installs only
# `.[dev]`, so without this pyright cannot resolve `lop_osworld_v2_adapter` and
# reports every adapter test as a missing import.
#
# This is a TYPE-RESOLUTION path only; it changes no runtime import. The tests
# themselves prepend the same directory in their conftest, and the SPAWNED tests
# install the real built wheel into a real interpreter rather than relying on
# either mechanism — which is what keeps this from masking a packaging break.
extraPaths = ["benchmarks/osworld_v2_adapter/src"]
# `exclude` REPLACES pyright's built-in defaults, it does not extend them, so
# the three defaults must be restated here alongside any addition of our own.
# Dropping `**/.*` is not cosmetic: every worktree (and the main checkout)
# carries a `.venv` symlink into the shared uv environment, so pyright walks it
# and enumerates the whole site-packages tree — 29466 source files instead of
# 566, a run that exceeds 30 minutes instead of ~15 seconds, and node workers
# past 3 GB RSS against a 4192 MB heap limit. CI never showed this because
# `.github/workflows/ci.yml` installs with `pip install -e ".[dev]"` into the
# runner's own interpreter and never creates a `.venv`, so the cost lands
# entirely on local runs of the documented gate command.
#
# `docs/` holds one-off tooling, not shipped package code — e.g.
# `docs/store/assets/build_assets.py`, a Pillow script that regenerates the
# Chrome Web Store screenshots from captured frames. Pillow ships no type stubs
# (Image.LANCZOS, ImageDraw.textbbox → Optional) so a strict whole-tree pyright
# run flags it, but it never imports into the package and is not part of the
# runtime surface the gate exists to protect. Excluding `docs/` keeps the
# type-check gate focused on `local_operator/` and `tests/` without weakening it
# for real code or littering a throwaway generator with per-line ignores.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "docs", "benchmarks/osworld_v2_adapter/**/evaluation_examples"]
# NOTE: venvPath/venv are deliberately NOT set here, even though a bare local
# `pyright` run resolves whatever interpreter it finds and reports spurious
# "import could not be resolved" errors that bury the real ones.
#
# Pinning them would fix the local run but couples this file to a layout CI
# does not have: `.github/workflows/ci.yml` installs with
# `pip install -e ".[dev]"` into the runner's own interpreter and never creates
# a `.venv`. Simulating that shape (no `.venv`, dependencies on the PATH
# interpreter) shows pyright warn ".venv subdirectory not found" and then fall
# back to that interpreter, finding the dependencies and exiting 0 — so it
# would not break the gate today. It is left unset because it buys nothing on
# CI while making the config silently dependent on a directory that only
# exists locally: with no `.venv` AND no dependencies on the resolved
# interpreter, the same fallback reports every third-party import as missing.
#
# Use the documented invocation instead (see AGENTS.md):
#   .venv/bin/python -m pyright --pythonpath .venv/bin/python .

[tool.pytest.ini_options]
# `-n auto` distributes the suite across worker processes, but the worker count
# is NOT one-per-core: the root `conftest.py` implements
# `pytest_xdist_auto_num_workers` and caps it (2..8) from a CPU share and a
# budget over *available* memory. Without that hook xdist resolves `auto` to
# `os.cpu_count()`, which on a 14-core host meant 14 workers and a measured
# 3,661 MB of worker RSS (vs 1,579 MB capped) — ruinous on this machine, where
# many git worktrees run
# suites concurrently (three at once drove load to 98-128 and exhausted swap).
# The suite is dominated by Textual pilot tests that spend their wall time
# waiting for the event loop rather than on CPU, so a wide run buys nothing:
# an interleaved A/B on tests/unit/server measured `-n 4` FASTER than `-n 14`
# (5.3-5.9s vs 7.8-11.3s) under that contention. See conftest.py for the full
# measurements and the fallback behaviour. CI is exempt from the CPU share (a
# dedicated runner has no contention to protect against) and keeps every core.
#
# `auto` must stay literal here: an explicit `-n N` in addopts would make both
# the hook and the env var inert.
#   PYTEST_XDIST_AUTO_NUM_WORKERS=N  per-session override, honoured unclamped.
#   -n0                              serialise for a debugger (`--pdb`/`-s`
#                                    need a single process); bypasses the hook.
#   -n 12                            an explicit count also bypasses the hook.
#
# `--dist worksteal`: per-test durations here vary by orders of magnitude
# (Textual pilot tests wait on the event loop; a pure-function test is
# microseconds). The default `load` scheduler pre-assigns work in chunks, so a
# worker that draws the slow tests still holds them while its peers sit idle at
# the tail of the run. worksteal lets an idle worker take pending tests off a
# busy one, which xdist documents as handling "tests with significantly
# differing duration" better — exactly this suite's shape.
#
# The old `-vv -s` was dropped deliberately: `-vv` prints a line per test,
# which is ~5.8k lines of I/O that buys nothing in CI logs, and `-s`
# (capture disabled) both adds that noise and is incompatible with xdist,
# which needs to capture worker output. Tests assert on return values and
# rendered frames, never on uncaptured stdout, so neither flag was load-bearing.
# `-m "not e2e"`: the headless TUI end-to-end stage (tests/e2e) is deselected
# from the default run and gets its own CI job. Two reasons, both about the
# fact that its failure mode is a HANG rather than an assertion:
#
#   1. It is bounded by `faulthandler.dump_traceback_later(exit=True)`, which
#      is the only watchdog that survives the kernel-level deadlock it exists
#      to catch (see tests/e2e/watchdog.py). When it fires it takes the whole
#      process down — acceptable in a dedicated job, but in the unit run under
#      xdist that would kill a worker carrying unrelated tests and report them
#      as an infrastructure error rather than as the freeze they actually are.
#   2. It contends real `flock` lock files and drives whole app lifecycles, so
#      it is wall-clock bound work that does not belong in the fast inner loop.
#
# Run it explicitly with:
#   env -u NO_COLOR TERM=xterm-256color .venv/bin/python -m pytest tests/e2e -m e2e -n0
addopts = "-n auto --dist worksteal -m \"not e2e\""
testpaths = ["tests"]
markers = [
    # Applied by LOCATION in tests/e2e/conftest.py, so a module in that package
    # cannot forget it and silently rejoin the unit run.
    "e2e: headless end-to-end tests that drive the assembled TUI application",
    # Kept IN the default run: these spawn real worker processes and are the
    # only coverage of the actual subprocess boundary, so they are marked for
    # selection rather than exclusion.
    "slow: tests that spawn real subprocesses and take seconds rather than ms",
]

# Coverage is measured through pytest-cov (`--cov`), which understands xdist
# and merges each worker's data automatically — the plain `coverage run -m
# pytest` the CI used before collects nothing from the worker subprocesses.
# Branch coverage stays off to match the historical line-only 80% gate.
[tool.coverage.run]
source = ["local_operator"]

[tool.coverage.report]
# The gate the `test` job enforces; kept here so a local `pytest --cov` fails
# the same way CI does instead of only printing a number.
fail_under = 80
