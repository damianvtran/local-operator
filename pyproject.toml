[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-operator"
version = "0.25.4"
description = "A team of proactive AI assistants that can work together behind the scenes to help you get mundane tasks done so you can focus on the fun stuff."
readme = "README.md"
authors = [{ name = "Damian Tran", email = "damian@gominerva.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["local", "agent", "execution", "operator", "agent-to-agent", "agentic", "local-first", "ai", "proactive"]
# The default install is deliberately small: the core agent (exec mode,
# provider clients, the tool loop, and the terminal UI) and nothing else.
# Everything with a heavy or platform-fragile footprint sits behind an extra
# below. Adding a dependency here is a decision about every user's install
# time, and on Windows about whether a compiled wheel exists at all.
dependencies = [
    # HTTP + data model. httpx drives every provider client and the OAuth
    # flows; pydantic is the schema layer the whole harness is typed against.
    "httpx>=0.27",
    "pydantic>=2.7",
    # PEP 696 TypeVar defaults are used in harness/types.py and only reached
    # typing in 3.13, while we support 3.12. Declared explicitly rather than
    # leaned on as a pydantic transitive, because an import in our own module
    # graph fails at import time if it goes missing.
    "typing-extensions>=4.6",
    # requests backs the legacy synchronous service clients (Radient, Ollama,
    # OpenRouter model listings) and model validation. Pure Python itself, but
    # note it pulls charset-normalizer, which DOES ship a compiled accelerator
    # (with a pure-Python fallback, so it degrades rather than building).
    "requests>=2.32.0",
    # Configuration and persistence: agent.yml / config.yml, skill front
    # matter, and .env loading. pyyaml ships a compiled libyaml accelerator
    # and publishes no pure-Python wheel, so it is the one remaining package
    # in the default set that can hit an sdist build on a platform/CPython
    # combination it has not published for.
    "pyyaml",
    "python-dotenv",
    # Terminal UI. This is the default entry point of the `local-operator`
    # command, so it stays required rather than optional. Pure Python, no
    # compiled wheels — textual pulls rich, which pulls pygments and
    # markdown-it-py. pygments is listed explicitly because the TUI imports
    # it directly for syntax token styling.
    "textual>=8.0.0",
    "rich>=13.7",
    "pygments>=2.13",
    # The desktop UI's installer runs a BARE `pip install local-operator` and
    # then launches `local-operator serve`, so the default set must stay fully
    # functional (0.15.10 had these in base; splitting them into extras broke
    # every already-shipped UI against 0.16.0). The [server]/[mcp]/[images]/
    # [tokenizer] extras remain as aliases for hosts that install by name.
    "fastapi",
    "starlette",
    "uvicorn",
    "python-multipart",
    "websockets>=15.0.1",
    "apscheduler",
    "dill",
    "tiktoken",
    "mcp>=1.2",
    "pillow-heif",
]
requires-python = ">=3.12"

[project.optional-dependencies]
# The HTTP API facade (local-operator serve) and the background scheduler it
# owns. fastapi/starlette/uvicorn/websockets/python-multipart are pure Python
# but total ~10 packages, and none of them are reachable from exec mode or
# the TUI. dill is here too: only the server's agent-context endpoints pickle
# execution namespaces. tiktoken is here because the /v1/chat routes report
# token stats in their responses: the code degrades to the chars/4 estimate
# without it, but an HTTP API returning approximate counts is a worse default
# than paying for one wheel on a host that already opted into a web server.
server = [
    "fastapi",
    "starlette",
    "uvicorn",
    "python-multipart",
    "websockets>=15.0.1",
    "apscheduler",
    "dill",
    "tiktoken",
]
# Model Context Protocol client support. The SDK's own chain is the single
# heaviest thing this project can install: a TLS stack (cryptography, via
# pyjwt[crypto]), a JSON Schema validator with a Rust-backed store, an
# OpenTelemetry API, an ASGI server, and the entire pywin32 bundle on Windows.
mcp = ["mcp>=1.2"]
# HEIC/HEIF image attachment decoding. Both wheels are compiled, and
# pillow-heif in particular is the most likely thing to have no wheel for a
# freshly released CPython on Windows.
images = ["pillow-heif"]
# Exact BPE token counting for context management. A compiled (Rust) wheel
# that also downloads its rank tables on first use; without it token
# estimation falls back to a chars/4 heuristic and compaction still works.
tokenizer = ["tiktoken"]
# Symbol-aware Python navigation for the `lsp` tool. jedi is pure Python and
# answers in-process — the only LSP shape with no server subprocess to
# install, spawn or babysit, which is why it can be an opt-in extra at all
# rather than a base dependency.
lsp = ["jedi>=0.19"]
all = ["local-operator[server,mcp,images,tokenizer]"]
dev = [
    "local-operator[all]",
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Distributes the suite across worker processes (`pytest -n`). The suite is
    # overwhelmingly wait-bound — Textual pilot tests spend their wall time
    # letting the event loop settle, not on CPU — so parallelism cuts CI wall
    # time roughly linearly with the runner's core count while leaving total
    # CPU work unchanged. See the `-n auto` note on `addopts` below.
    "pytest-xdist",
    "pytest-textual-snapshot",
    "pip-audit",
    # Independent decoder used to verify our own PNG encoder's output.
    "pillow",
    # Direct, not via the lsp extra: CI installs dev and must exercise the
    # optional tool's suite, while `all` stays lean for end users.
    "jedi>=0.19",
]

# Explicit package discovery. Without this, setuptools falls back to
# flat-layout AUTO-discovery, which walks the repo root, finds both
# `local_operator/` and `static/` (image assets, no __init__.py) and refuses
# with "Multiple top-level packages discovered in a flat-layout". The deleted
# setup.py used to supply `packages=find_packages()`, which is what suppressed
# auto-discovery; pyproject has to say it explicitly now. `pip install .`
# fails outright without this, so it is load-bearing, not tidiness.
[tool.setuptools.packages.find]
include = ["local_operator*"]

[tool.setuptools.package-data]
local_operator = [
    "prompts_md/*.md",
    "guides/*/*.md",
    "tui/*.tcss",
    # Packaged starter role profiles. Without this they are absent from a
    # wheel, and ``task(agent="reviewer")`` silently degrades to an unguided
    # child on every non-source install.
    "agent_seeds/*.md",
    # The phone control plane's built SPA. The daemon serves it from
    # local_operator/mobile/web/dist/; without this a pip/uv install has
    # no UI and every authed GET answers 503 "bundle not built".
    "mobile/web/dist/*",
    "mobile/web/dist/assets/*",
    # The web SOURCES too: dist/ is gitignored, so a source snapshot (git
    # archive, sdist) has no built bundle, and the dist globs above then match
    # nothing — which used to drop the WHOLE web tree and make the 503
    # unrecoverable (no package.json to rebuild from). Shipping the sources
    # lets the daemon's self-heal (`lop mobile install`) rebuild the bundle on
    # any host with Node; the build inputs (node_modules, lockfile-resolved
    # deps) are never packaged.
    "mobile/web/package.json",
    "mobile/web/pnpm-lock.yaml",
    "mobile/web/pnpm-workspace.yaml",
    "mobile/web/index.html",
    "mobile/web/tsconfig*.json",
    "mobile/web/vite.config.ts",
    "mobile/web/scripts/*.mjs",
    "mobile/web/public/*",
    # setuptools package-data does not recurse with `**` here, so the source
    # tree is enumerated by directory. New src subdirectories need a line.
    "mobile/web/src/*.ts",
    "mobile/web/src/*.tsx",
    "mobile/web/src/components/*.tsx",
    "mobile/web/src/components/ui/*.tsx",
    "mobile/web/src/lib/*.ts",
    "mobile/web/src/screens/*.tsx",
    "mobile/web/src/styles/*.css",
    "mobile/web/src/themes/*.ts",
    # The login page's LO mark, served unauthenticated at /mark.png from
    # mobile/static/. Missing it shows a broken image on sign-in.
    "mobile/static/*",
]

[project.urls]
Homepage = "https://github.com/damianvtran/local-operator"

[project.scripts]
local-operator = "local_operator.cli:main"
# `lop` is the short form every doc, hint and the stable `~/.local/bin/lop`
# launcher already assumes. Registering it here makes a standard
# `pip`/`uv tool install` provide it too, so the session-ended "resume with:"
# hint can name a command that exists without the machine-specific launcher.
# setuptools/pip generate the platform-correct wrapper (console-script shim on
# Unix, .exe launcher on Windows), so the alias is cross-platform by
# construction rather than by a POSIX-only symlink.
lop = "local_operator.cli:main"

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = "F401"

[tool.pylint."messages control"]
ignore = ["__init__.py"]
disable = "all"
enable = [
    "empty-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring"
]

[tool.isort]
profile = "black"

[tool.pyright]
reportMissingTypeArgument = true
strictListInference = true
reportPrivateImportUsage = false
# NOTE: venvPath/venv are deliberately NOT set here, even though a bare local
# `pyright` run resolves whatever interpreter it finds and reports spurious
# "import could not be resolved" errors that bury the real ones.
#
# Pinning them would fix the local run but couples this file to a layout CI
# does not have: `.github/workflows/ci.yml` installs with
# `pip install -e ".[dev]"` into the runner's own interpreter and never creates
# a `.venv`. Simulating that shape (no `.venv`, dependencies on the PATH
# interpreter) shows pyright warn ".venv subdirectory not found" and then fall
# back to that interpreter, finding the dependencies and exiting 0 — so it
# would not break the gate today. It is left unset because it buys nothing on
# CI while making the config silently dependent on a directory that only
# exists locally: with no `.venv` AND no dependencies on the resolved
# interpreter, the same fallback reports every third-party import as missing.
#
# Use the documented invocation instead (see AGENTS.md):
#   .venv/bin/python -m pyright --pythonpath .venv/bin/python .

[tool.pytest.ini_options]
# `-n auto` distributes the suite across one worker process per logical core.
# The suite is dominated by Textual pilot tests that spend their wall time
# waiting for the event loop to settle rather than on CPU, so this scales CI
# wall time down roughly with the core count (4 on GitHub's ubuntu-latest)
# without changing what each test does. Run `-n0` locally to serialise for a
# debugger (`--pdb`/`-s` need a single process).
#
# The old `-vv -s` was dropped deliberately: `-vv` prints a line per test,
# which is ~5.8k lines of I/O that buys nothing in CI logs, and `-s`
# (capture disabled) both adds that noise and is incompatible with xdist,
# which needs to capture worker output. Tests assert on return values and
# rendered frames, never on uncaptured stdout, so neither flag was load-bearing.
addopts = "-n auto"
testpaths = ["tests"]

# Coverage is measured through pytest-cov (`--cov`), which understands xdist
# and merges each worker's data automatically — the plain `coverage run -m
# pytest` the CI used before collects nothing from the worker subprocesses.
# Branch coverage stays off to match the historical line-only 80% gate.
[tool.coverage.run]
source = ["local_operator"]

[tool.coverage.report]
# The gate the `test` job enforces; kept here so a local `pytest --cov` fails
# the same way CI does instead of only printing a number.
fail_under = 80
