[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-operator"
version = "0.15.10"
description = "A team of proactive AI assistants that can work together behind the scenes to help you get mundane tasks done so you can focus on the fun stuff."
readme = "README.md"
authors = [{ name = "Damian Tran", email = "damian@radienthq.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]
keywords = ["local", "agent", "execution", "operator", "agent-to-agent", "agentic", "local-first", "ai", "proactive"]
dependencies = [
    # Harness / providers
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken",
    "python-dotenv",
    "pyyaml",
    "jsonlines",
    "python-dateutil>=2.8.0",
    # Server / API contract
    "uvicorn",
    "fastapi",
    "python-multipart",
    "websockets>=15.0.1",
    "requests>=2.32.0",
    # Scheduler / persistence
    "apscheduler",
    # TUI
    "textual>=8.0.0",
    "rich>=13.7",
    "markdown-it-py>=3.0",
    # MCP
    "mcp>=1.2",
    # Skills semantic search
    "faiss-cpu==1.10.0",
    # Platform glue / media
    "psutil",
    "pillow",
    "pillow-heif",
    "pyreadline3",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-textual-snapshot",
    "pip-audit",
]

[tool.setuptools.package-data]
local_operator = ["prompts_md/*.md", "tui/*.tcss"]

[project.urls]
Homepage = "https://github.com/damianvtran/local-operator"

[project.scripts]
local-operator = "local_operator.cli:main"

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = "F401"

[tool.pylint."messages control"]
ignore = ["setup.py", "__init__.py"]
disable = "all"
enable = [
    "empty-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring"
]

[tool.isort]
profile = "black"

[tool.pyright]
reportMissingTypeArgument = true
strictListInference = true
reportPrivateImportUsage = false

[tool.pytest.ini_options]
addopts = "-vv -s"
testpaths = ["tests"]
