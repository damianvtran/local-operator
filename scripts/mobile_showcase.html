<!doctype html><html lang="en"><meta charset="utf-8">
<title>Isolated relay showcase</title>
<style>body{margin:0;padding:8px;background:#ddd;font:14px system-ui}header{display:flex;gap:12px;align-items:center;margin-bottom:8px}pre{position:absolute;inset-inline-start:420px;top:50px;max-width:700px;white-space:pre-wrap}iframe{display:block;border:0;width:390px;height:844px}label{display:flex;gap:4px}</style>
<header><label>Phone <select id="phone"><option>390x844</option><option>360x780</option><option>320x568</option><option>844x390</option></select></label>
<label>Theme <select id="theme"><option value="localOperatorDark">Dark</option><option value="localOperatorLight">Light</option></select></label>
<button id="phone390" onclick="document.querySelector('#phone').value='390x844';setup()">390 phone</button>
<button id="phone360" onclick="document.querySelector('#phone').value='360x780';setup()">360 phone</button>
<button id="phone320" onclick="document.querySelector('#phone').value='320x568';setup()">320 phone</button>
<button id="phonelandscape" onclick="document.querySelector('#phone').value='844x390';setup()">Landscape</button>
<button id="dark" onclick="document.querySelector('#theme').value='localOperatorDark';setup()">Dark theme</button>
<button id="light" onclick="document.querySelector('#theme').value='localOperatorLight';setup()">Light theme</button>
<label><input id="rtl" type="checkbox">Force RTL</label><a href="/showcase">Reset</a>
<label>State <input id="state" value="list-populated"></label><button id="audit">Audit</button><button id="bandcheck" title="Fixture-only: report the band table's min-content width at the cell font and at the inherited font, the form the component chose, and whether that form survives 3 s of width oscillation">Check table band</button><button id="reveal" title="Fixture-only: scroll the phone's conversation so its code block and table are on screen (the capture tool cannot scroll inside a frame)">Reveal code</button></header><pre id="result"></pre><pre id="framebox" aria-hidden="true"></pre>
<iframe title="Phone relay" id="phone-relay" src="/"></iframe>
<script src="/showcase/metrics.js"></script><script>
const frame=document.querySelector('iframe');
/* The phone's CSS box, published so a capture can crop exactly the phone instead
   of guessing where it sits (a 390-tall landscape phone leaves the page shorter
   than the window, so "crop from the image bottom" is the wrong anchor). */
function publishFrameBox(){const r=frame.getBoundingClientRect();document.querySelector('#framebox').textContent=JSON.stringify([Math.round(r.left),Math.round(r.top+scrollY),Math.round(r.width),Math.round(r.height)]);}
function setup(){const [w,h]=document.querySelector('#phone').value.split('x');frame.style.width=w+'px';frame.style.height=h+'px';const doc=frame.contentDocument;if(doc){doc.documentElement.dataset.theme=document.querySelector('#theme').value;doc.documentElement.dir=document.querySelector('#rtl').checked?'rtl':'ltr';}publishFrameBox();}
document.querySelector('#audit').addEventListener('click',async()=>{const data=JSON.parse(window.measureRelay(frame.contentWindow));data.device_pixel_ratio=frame.contentWindow.devicePixelRatio;data.theme=frame.contentDocument.documentElement.dataset.theme;data.direction=frame.contentDocument.documentElement.dir;const result={state:document.querySelector('#state').value,metrics:data};document.querySelector('#result').textContent=JSON.stringify(result);await fetch('/showcase/metrics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});});
/* THE FLIP-FLOP CHECK (code review round 3, C3-1). Fixture-only: nothing product
   code reads.

   It reports, as numbers: the band table's min-content total measured at the CELL
   font (13 px) and at the wrapper's previously-inherited font (14 px), plus the
   width the table is laid out in — so "this table is inside the band" is checkable
   rather than asserted. Then, at a FIXED width where those two answers disagree, it
   samples the rendered form and the wrapper rect every 250 ms for 3 s: one form
   throughout is the pass (the old code re-decided on a height change the decision
   itself caused, and could alternate). */
document.querySelector('#bandcheck').addEventListener('click',async()=>{
  const doc=frame.contentDocument, win=frame.contentWindow;
  const findWrapper=()=>[...doc.querySelectorAll('[role="table"], table')]
    .map(el=>el.closest('.lo-table-font')||el)
    .find(el=>el.textContent.includes('counterreconciliation'));
  const wrapper=findWrapper();
  if(!wrapper){document.querySelector('#result').textContent='{"band":"table not found"}';return;}
  const probe=doc.createElement('canvas').getContext('2d');
  const cellsOf=(node)=>{
    const row=node.querySelector('[role="row"]')||node.querySelector('tr');
    return row?[...row.children]:[];
  };
  const total=(node,px)=>{
    const cells=cellsOf(node);
    if(!cells.length) return null;
    const st=win.getComputedStyle(cells[0]);
    probe.font=`${st.fontWeight} ${px}px ${st.fontFamily}`;
    const widths=cells.map(c=>Math.ceil(Math.max(0,...c.textContent.replace(/:$/,'').split(/\s+/)
      .filter(Boolean).map(w=>probe.measureText(w).width)))+16);
    return {widths, total:widths.reduce((a,b)=>a+b,0)+2};
  };
  /* Freeze the width where the two candidate fonts disagree (295 px = a 320 phone's
     wrapper), so a change of form cannot be a legitimate width re-decision. */
  /* 372 px of iframe = a 337 px wrapper: between this table's 13 px total (326)
     and its 14 px total (346), i.e. inside the band the wrong font decided. */
  frame.style.width='372px';
  await new Promise(r=>setTimeout(r,1200));
  const node=findWrapper();
  const at13=total(node,13), at14=total(node,14);
  const samples=[];
  for(let i=0;i<12;i++){
    const current=findWrapper();
    const r=current.getBoundingClientRect();
    samples.push({t:i*250, form:current.querySelector('table')?'table':'stacked',
      rect:[Math.round(r.width),Math.round(r.height)]});
    await new Promise(res=>setTimeout(res,250));
  }
  const out={available:Math.round(findWrapper().getBoundingClientRect().width),
    totalAt13px:at13&&at13.total, totalAt14px:at14&&at14.total,
    widthsAt13px:at13&&at13.widths,
    band:Boolean(at13&&at14&&at14.total>out_width&&at13.total<=out_width),
    finalForm:findWrapper().querySelector('table')?'table':'stacked',
    formsSeen:[...new Set(samples.map(x=>x.form))], sampleCount:samples.length, samples};
  var out_width=Math.round(findWrapper().getBoundingClientRect().width);
  out.band=Boolean(at13&&at14&&at14.total>out_width&&at13.total<=out_width);
  document.querySelector('#result').textContent=JSON.stringify(out);
  /* Stow the numbers with the page's own evidence, under the SAME shape the audit
     uses, so a band check cannot need a second POST contract (a body without
     `metrics` used to kill the fixture). */
  try{
    await fetch('/showcase/metrics',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({state:document.querySelector('#state').value+'band',metrics:{
        viewport:[out.available,out.available],theme:'band',band:out}})});
  }catch(error){ /* evidence is best-effort: the on-page result is the record */ }
});
document.querySelector('#reveal').addEventListener('click',()=>{const pre=frame.contentDocument.querySelector('pre');if(pre)pre.scrollIntoView({block:'start'});});
frame.addEventListener('load',setup);document.querySelectorAll('#phone,#theme,#rtl').forEach(el=>el.addEventListener('change',setup));
</script></html>
