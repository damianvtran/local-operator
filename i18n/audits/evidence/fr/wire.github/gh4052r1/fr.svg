</text><text class="terminal-3501509845-r2" x="0" y="922.8" textLength="1207.8" clip-path="url(#terminal-3501509845-line-37)">liste&#160;auparavant&#160;partagée&#160;et&#160;choisie&#160;à&#160;la&#160;main&#160;arrête&#160;le&#160;prêt ;&#160;revenez&#160;à&#160;la&#160;sélection&#160;automatique&#160;</text><text class="terminal-3501509845-r2" x="1220" y="922.8" textLength="12.2" clip-path="url(#terminal-3501509845-line-37)">
