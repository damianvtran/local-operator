</text><text class="terminal-2684502663-r2" x="0" y="44.4" textLength="695.4" clip-path="url(#terminal-2684502663-line-1)">GitHub仓库：暂无——共享已设置，但只要手动选择的GitHub仓库设置在去除已排除项后不含任何仓库，就会拒绝所</text><text class="terminal-2684502663-r2" x="1220" y="44.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-1)">
</text><text class="terminal-2684502663-r2" x="0" y="68.8" textLength="902.8" clip-path="url(#terminal-2684502663-line-2)">有借用；在GitHub仓库设置中添加仓库（在/settings中搜索），或用lop&#160;network&#160;credential&#160;github&#160;repos&#160;</text><text class="terminal-2684502663-r2" x="1220" y="68.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-2)">
</text><text class="terminal-2684502663-r2" x="0" y="93.2" textLength="402.6" clip-path="url(#terminal-2684502663-line-3)">--use-default明确恢复为所有可push仓库减去已排除项</text><text class="terminal-2684502663-r2" x="1220" y="93.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-3)">
</text><text class="terminal-2684502663-r2" x="1220" y="117.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-4)">
</text><text class="terminal-2684502663-r1" x="0" y="142" textLength="305" clip-path="url(#terminal-2684502663-line-5)">zh-CN&#160;/&#160;empty_unavailable</text><text class="terminal-2684502663-r2" x="1220" y="142" textLength="12.2" clip-path="url(#terminal-2684502663-line-5)">
</text><text class="terminal-2684502663-r2" x="0" y="166.4" textLength="585.6" clip-path="url(#terminal-2684502663-line-6)">GitHub仓库：暂无——共享已设置，但只要未能获取此设备GitHub账号可push的仓库列表&#160;</text><text class="terminal-2684502663-r2" x="1220" y="166.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-6)">
</text><text class="terminal-2684502663-r2" x="0" y="190.8" textLength="732" clip-path="url(#terminal-2684502663-line-7)">(无法连接GitHub)，且没有可回退使用的旧列表，就会拒绝所有借用；GitHub可访问后重试：lop&#160;network&#160;</text><text class="terminal-2684502663-r2" x="1220" y="190.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-7)">
</text><text class="terminal-2684502663-r2" x="0" y="215.2" textLength="402.6" clip-path="url(#terminal-2684502663-line-8)">credential&#160;github&#160;repos&#160;--refresh</text><text class="terminal-2684502663-r2" x="1220" y="215.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-8)">
</text><text class="terminal-2684502663-r2" x="1220" y="239.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-9)">
</text><text class="terminal-2684502663-r1" x="0" y="264" textLength="195.2" clip-path="url(#terminal-2684502663-line-10)">zh-CN&#160;/&#160;excluded</text><text class="terminal-2684502663-r2" x="1220" y="264" textLength="12.2" clip-path="url(#terminal-2684502663-line-10)">
</text><text class="terminal-2684502663-r2" x="0" y="288.4" textLength="658.8" clip-path="url(#terminal-2684502663-line-11)">octo-org/website已被排除——共享对象设备下次获取凭据时将失去对该仓库的push权限，5分钟内</text><text class="terminal-2684502663-r2" x="1220" y="288.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-11)">
</text><text class="terminal-2684502663-r2" x="1220" y="312.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-12)">
</text><text class="terminal-2684502663-r1" x="0" y="337.2" textLength="195.2" clip-path="url(#terminal-2684502663-line-13)">zh-CN&#160;/&#160;included</text><text class="terminal-2684502663-r2" x="1220" y="337.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-13)">
</text><text class="terminal-2684502663-r2" x="0" y="361.6" textLength="671" clip-path="url(#terminal-2684502663-line-14)">octo-org/website已重新纳入——共享对象设备下次获取凭据时将恢复对该仓库的push权限，5分钟内</text><text class="terminal-2684502663-r2" x="1220" y="361.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-14)">
</text><text class="terminal-2684502663-r2" x="1220" y="386" textLength="12.2" clip-path="url(#terminal-2684502663-line-15)">
</text><text class="terminal-2684502663-r1" x="0" y="410.4" textLength="207.4" clip-path="url(#terminal-2684502663-line-16)">zh-CN&#160;/&#160;last_good</text><text class="terminal-2684502663-r2" x="1220" y="410.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-16)">
</text><text class="terminal-2684502663-r2" x="0" y="434.8" textLength="573.4" clip-path="url(#terminal-2684502663-line-17)">2天前获取的列表——刚才无法列出GitHub仓库&#160;(无法连接GitHub)，因此列表可能已过时</text><text class="terminal-2684502663-r2" x="1220" y="434.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-17)">
</text><text class="terminal-2684502663-r2" x="1220" y="459.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-18)">
</text><text class="terminal-2684502663-r1" x="0" y="483.6" textLength="158.6" clip-path="url(#terminal-2684502663-line-19)">zh-CN&#160;/&#160;ready</text><text class="terminal-2684502663-r2" x="1220" y="483.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-19)">
</text><text class="terminal-2684502663-r2" x="0" y="508" textLength="915" clip-path="url(#terminal-2684502663-line-20)">octo-org/website和octo-org/api（2——其账号可push的所有仓库，列出时间：2天前）——完整列表：lop&#160;network&#160;</text><text class="terminal-2684502663-r2" x="1220" y="508" textLength="12.2" clip-path="url(#terminal-2684502663-line-20)">
</text><text class="terminal-2684502663-r2" x="0" y="532.4" textLength="463.6" clip-path="url(#terminal-2684502663-line-21)">credential&#160;github&#160;repos（在lender-qa上运行）</text><text class="terminal-2684502663-r2" x="1220" y="532.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-21)">
</text><text class="terminal-2684502663-r2" x="1220" y="556.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-22)">
</text><text class="terminal-2684502663-r1" x="0" y="581.2" textLength="268.4" clip-path="url(#terminal-2684502663-line-23)">zh-CN&#160;/&#160;wrapper_denied</text><text class="terminal-2684502663-r2" x="1220" y="581.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-23)">
</text><text class="terminal-2684502663-r2" x="0" y="605.6" textLength="732" clip-path="url(#terminal-2684502663-line-24)">octo-org/website不在出借设备提供的仓库列表中（可能已被排除，或在该设备上不可push）。在出借设备上检查</text><text class="terminal-2684502663-r2" x="1220" y="605.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-24)">
</text><text class="terminal-2684502663-r2" x="0" y="630" textLength="622.2" clip-path="url(#terminal-2684502663-line-25)">lop&#160;network&#160;credential&#160;github&#160;repos。只有该设备才能更改其出借范围。</text><text class="terminal-2684502663-r2" x="1220" y="630" textLength="12.2" clip-path="url(#terminal-2684502663-line-25)">
</text><text class="terminal-2684502663-r2" x="1220" y="654.4" textLength="12.2" clip-path="url(#terminal-2684502663-line-26)">
</text><text class="terminal-2684502663-r1" x="0" y="678.8" textLength="256.2" clip-path="url(#terminal-2684502663-line-27)">zh-CN&#160;/&#160;settings_help</text><text class="terminal-2684502663-r2" x="1220" y="678.8" textLength="12.2" clip-path="url(#terminal-2684502663-line-27)">
</text><text class="terminal-2684502663-r2" x="0" y="703.2" textLength="732" clip-path="url(#terminal-2684502663-line-28)">可出借GitHub访问权限的owner/repo条目。若从未设置，则使用该账号可push的所有仓库，减去已排除项。清空先</text><text class="terminal-2684502663-r2" x="1220" y="703.2" textLength="12.2" clip-path="url(#terminal-2684502663-line-28)">
</text><text class="terminal-2684502663-r2" x="0" y="727.6" textLength="878.4" clip-path="url(#terminal-2684502663-line-29)">前已共享的手选列表会停止出借；用lop&#160;network&#160;credential&#160;github&#160;repos&#160;--use-default恢复自动选择。</text><text class="terminal-2684502663-r2" x="1220" y="727.6" textLength="12.2" clip-path="url(#terminal-2684502663-line-29)">
</text><text class="terminal-2684502663-r2" x="1220" y="752" textLength="12.2" clip-path="url(#terminal-2684502663-line-30)">
