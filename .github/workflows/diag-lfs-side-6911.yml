name: Owned sidebar render-baseline diagnostic 6911
on:
  push:
    branches: [diag/lfs-side-baseline-6911]
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup closure or STOP
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install -e '.[dev]'
      - name: Two original sidebar selectors serially
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B scripts/run_bounded.py --timeout 220 --grace 5 --memory-mb 512 -- python -B scripts/diagnostics/lfs_side_6911/controller.py "$RUNNER_TEMP/lfs-side-6911"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lfs-side-6911-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lfs-side-6911/side.json
          if-no-files-found: warn
          retention-days: 3
