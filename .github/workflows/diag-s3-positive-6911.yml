name: Owned six original S3 controls 6911
on:
  push:
    branches: [diag/s3-native-controls-6911]
permissions:
  contents: read
jobs:
  s3-positive:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        timeout-minutes: 1
        with:
          python-version: '3.12'
      - name: Setup closure or STOP
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install -e '.[dev]' textual==8.2.8
      - name: Six original cases in TWO serial children
        timeout-minutes: 2
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B scripts/run_bounded.py --timeout 100 --grace 5 --memory-mb 512 -- python -B -m scripts.diagnostics.s3_positive_6911.controller "$RUNNER_TEMP/s3-controls-6911"
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 1
        with:
          name: s3-controls-6911-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s3-controls-6911/s3.json
          retention-days: 3
          if-no-files-found: warn
