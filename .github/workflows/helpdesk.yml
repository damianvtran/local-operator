                    "run_id": os.environ["GITHUB_RUN_ID"],
                    "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                    "python": platform.python_version(),
                    "test_source_sha256": {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['tests/unit/tui/test_source_frontend_coalescer.py', 'tests/e2e/test_ask_queue_e2e.py']}}
          root = Path.cwd().resolve()
          spec = importlib.util.find_spec("local_operator")
