          python -m isort --check-only tests/unit/tui/test_source_frontend_coalescer.py tests/e2e/test_ask_queue_e2e.py
          python -m flake8 --jobs 1 tests/unit/tui/test_source_frontend_coalescer.py tests/e2e/test_ask_queue_e2e.py
          git diff --exit-code -- tests/unit/tui/test_source_frontend_coalescer.py tests/e2e/test_ask_queue_e2e.py
      - name: Prepare the one public tokenizer table — no provider discovery
        run: |
          set -euo pipefail
