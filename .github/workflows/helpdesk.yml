          import hashlib, os, urllib.request
          from pathlib import Path
          # Setup-only public data, pinned before pytest; selected tests never
          # need to download a catalogue or tokenizer while asserting callback behavior.
          url = "https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken"
          expected = "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7"
          directory = Path(os.environ["RUNNER_TEMP"]) / "request-boundary-fixture-bpe"
          directory.mkdir()
          with urllib.request.urlopen(url, timeout=15) as response:
              data = response.read(2_000_001)
          assert len(data) <= 2_000_000 and hashlib.sha256(data).hexdigest() == expected
          (directory / hashlib.sha1(url.encode()).hexdigest()).write_bytes(data)
          PY
      - name: Run two fixed profiles separately — C A then A C then C A
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            profiles=(C A)
            if [ "$pass" -eq 2 ]; then profiles=(A C); fi
            printf '%s\n' "${profiles[@]}" > "$RUNNER_TEMP/request-boundary-fixture-evidence/profiles-$pass.txt"
            for profile in "${profiles[@]}"; do
              case "$profile" in
                C) node=tests/unit/tui/test_source_frontend_coalescer.py::test_a_retired_source_still_clears_its_bit_and_acts_on_nothing; marker='not e2e' ;;
                A) node=tests/e2e/test_ask_queue_e2e.py::test_a_multi_question_ask_is_answered_atomically; marker='e2e' ;;
                *) exit 2 ;;
              esac
              iso="$RUNNER_TEMP/request-boundary-fixture-pass-$pass-$profile"
              mkdir -p "$iso/home" "$iso/config" "$iso/cache" "$iso/tmp"
              printf '%s\n' "$node" > "$RUNNER_TEMP/request-boundary-fixture-evidence/order-$pass-$profile.txt"
              env -i PATH="$PATH" HOME="$iso/home" LOCAL_OPERATOR_CONFIG_DIR="$iso/config" XDG_CACHE_HOME="$iso/cache" TMPDIR="$iso/tmp" TIKTOKEN_CACHE_DIR="$RUNNER_TEMP/request-boundary-fixture-bpe" TERM=xterm-256color LOP_LANG=en PYTHON_DOTENV_DISABLED=1 PYTHONDONTWRITEBYTECODE=1 \
                python -m pytest -n0 -x -v -rA -m "$marker" --basetemp "$iso/pytest" -o "cache_dir=$iso/pytest-cache" --junitxml="$RUNNER_TEMP/request-boundary-fixture-evidence/junit-$pass-$profile.xml" "$node" \
                2>&1 | tee "$RUNNER_TEMP/request-boundary-fixture-evidence/pytest-$pass-$profile.log"
              PASS_NUMBER="$pass" CELL_PROFILE="$profile" python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "request-boundary-fixture-evidence"
          suffix = os.environ["PASS_NUMBER"] + "-" + os.environ["CELL_PROFILE"]
          cases = list(ET.parse(evidence / f"junit-{suffix}.xml").iter("testcase"))
          expected = [node.split("::", 1)[1] for node in (evidence / f"order-{suffix}.txt").read_text().splitlines()]
          assert len(expected) == 1 and len(cases) == 1 and [case.get("name") for case in cases] == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error"))
          (evidence / f"count-{suffix}.json").write_text(json.dumps({"profile": os.environ["CELL_PROFILE"], "calls": 1, "failures": 0, "errors": 0, "skips": 0, "order": expected}, indent=2) + "\n")
          PY
            done
            PASS_NUMBER="$pass" python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "request-boundary-fixture-evidence"
          number = os.environ["PASS_NUMBER"]
          profiles = (evidence / f"profiles-{number}.txt").read_text().splitlines()
          assert profiles == (["A", "C"] if number == "2" else ["C", "A"])
          rows = [json.loads((evidence / f"count-{number}-{profile}.json").read_text()) for profile in profiles]
          assert [row["profile"] for row in rows] == profiles
          assert all(row["calls"] == 1 and row["failures"] == row["errors"] == row["skips"] == 0 for row in rows)
          (evidence / f"pass-count-{number}.json").write_text(json.dumps({"calls": 2, "profiles": profiles}, indent=2) + "\n")
          PY
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "request-boundary-fixture-evidence"
          rows = [json.loads((evidence / f"pass-count-{number}.json").read_text()) for number in (1, 2, 3)]
          assert [row["profiles"] for row in rows] == [["C", "A"], ["A", "C"], ["C", "A"]]
          assert [row["calls"] for row in rows] == [2, 2, 2]
          (evidence / "total-count.json").write_text(json.dumps({"calls": 6, "calls_per_profile": {"C": 3, "A": 3}, "processes": 6}, indent=2) + "\n")
          PY
      - name: Retain exact-head evidence even on first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-boundaries-${{ github.sha }}-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/request-boundary-fixture-evidence/
          if-no-files-found: error
          retention-days: 7
