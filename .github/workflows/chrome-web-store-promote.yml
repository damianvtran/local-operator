name: Promote staged Chrome Web Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved staged extension version to publish
        required: true

permissions:
  contents: read
  id-token: write
  # `actions: read` is what verify-release-environment.sh needs for the two
  # endpoints it still calls: GET environments/{env} and its
  # deployment-branch-policies (both answer 200 with
  # x-accepted-github-permissions: actions=read).
  #
  # It is NOT sufficient for the environment-variables endpoint, which the
  # script used to call and no longer does. That endpoint demands
  # `environments=read`, which is not a permission a workflow token can be
  # granted — a probe job with `permissions: write-all` still gets 403. The
  # variable-scope invariant is proved by the preflight job below instead. Do
  # not "fix" a future 403 there by adding scopes; there is no scope to add.
  actions: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  # Runs deliberately OUTSIDE the environment; see the equivalent job in
  # chrome-web-store.yml. Promotion is the publish step, so the same
  # variable-scope invariant has to hold before it authenticates.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require release variables to be environment-scoped only
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          extension/scripts/verify-release-environment.sh --assert-unscoped-empty \
            CWS_PUBLISHER_ID "$CWS_PUBLISHER_ID" \
            CWS_EXTENSION_ID "$CWS_EXTENSION_ID" \
            GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" \
            CWS_SERVICE_ACCOUNT "$CWS_SERVICE_ACCOUNT"

  promote:
    needs: preflight
    runs-on: ubuntu-latest
    # Promotion is a distinct, explicit launch decision: dispatching this
    # workflow is the act of publishing. The environment's former
    # required-reviewer gate was removed by operator decision on 2026-09-03, so
    # once dispatched, promotion completes automatically; the environment still
    # scopes the release variables and the main-only deployment branch policy,
    # and the launch decision rides on the reviewed-merge-to-main process plus
    # the WIF attribute condition pinning refs/heads/main.
    environment: chrome-web-store-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the workflow commit from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # Promotion runs the token-bearing client from the checked-out commit;
          # refusing non-main ancestry prevents dispatching altered release code.
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::promotion must run from a commit on main"
            exit 1
          }
      - name: Verify protected environment configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          extension/scripts/verify-release-environment.sh chrome-web-store-production \
            CWS_PUBLISHER_ID "$CWS_PUBLISHER_ID" \
            CWS_EXTENSION_ID "$CWS_EXTENSION_ID" \
            GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" \
            CWS_SERVICE_ACCOUNT "$CWS_SERVICE_ACCOUNT"
      - name: Authenticate without a service-account key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Verify and publish the reviewed staged version
        working-directory: extension
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: bash scripts/chrome-web-store.sh promote "$EXPECTED_VERSION"
