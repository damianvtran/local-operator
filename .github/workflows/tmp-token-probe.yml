name: TEMP token permission probe

# TEMPORARY diagnostic workflow, deleted before this branch's PR is finalised.
# Round 2 probes the redesign premise: are environment-scoped variables really
# invisible to a job that does not reference the environment? That difference is
# what replaces the ungrantable environments=read API check.
# Touches no secrets, no external service, uploads nothing.

on:
  push:
    branches:
      - dev-store-verify-403

jobs:
  outside-environment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: vars visible WITHOUT an environment
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          for n in CWS_PUBLISHER_ID CWS_EXTENSION_ID GCP_WIF_PROVIDER CWS_SERVICE_ACCOUNT; do
            v="${!n}"
            if [[ -n "$v" ]]; then echo "OUTSIDE $n = VISIBLE (len ${#v})"; else echo "OUTSIDE $n = EMPTY"; fi
          done

  inside-environment:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      actions: read
    steps:
      - name: vars visible WITH the environment
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          for n in CWS_PUBLISHER_ID CWS_EXTENSION_ID GCP_WIF_PROVIDER CWS_SERVICE_ACCOUNT; do
            v="${!n}"
            if [[ -n "$v" ]]; then echo "INSIDE $n = VISIBLE (len ${#v})"; else echo "INSIDE $n = EMPTY"; fi
          done
      - name: environment + branch policy endpoints under actions:read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "environments/chrome-web-store" \
                   "environments/chrome-web-store/deployment-branch-policies?per_page=100"; do
            echo "=== $p"
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | jq -c '{deployment_branch_policy, total_count, branch_policies}'
          done
