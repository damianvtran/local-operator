name: TEMP token permission probe

# TEMPORARY diagnostic workflow, deleted before this branch's PR is finalised.
# Round 3 checks the remaining redesign question: is the repository-scoped
# variables endpoint reachable from a workflow token (an alternative way to
# prove "not defined at repository scope"), and does the preflight differential
# job behave as designed. Touches no secrets and uploads nothing.

on:
  push:
    branches:
      - dev-store-verify-403

jobs:
  repo-variables-endpoint:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: repo-scoped variables endpoint under write-all
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "actions/variables?per_page=100" "actions/variables/CWS_PUBLISHER_ID"; do
            echo "=== $p"
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | grep -iE '^HTTP|x-accepted-github-permissions' || true
          done
