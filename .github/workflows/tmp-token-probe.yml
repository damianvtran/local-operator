name: TEMP token permission probe

# TEMPORARY diagnostic workflow. Deleted before this branch's PR is finalised.
# It determines empirically which `permissions:` scope a workflow GITHUB_TOKEN
# needs for the three endpoints verify-release-environment.sh calls, by reading
# the X-Accepted-GitHub-Permissions response header GitHub returns on 403.
# It touches no environment, no secrets and no external service.

on:
  push:
    branches:
      - dev-store-verify-403

jobs:
  actions-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: probe with actions:read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "environments/chrome-web-store" \
                   "environments/chrome-web-store/deployment-branch-policies?per_page=100" \
                   "environments/chrome-web-store/variables?per_page=100"; do
            echo "=== $p"
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | grep -iE '^HTTP|x-accepted-github-permissions' || true
          done

  deployments-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - name: probe with deployments:read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "environments/chrome-web-store" \
                   "environments/chrome-web-store/deployment-branch-policies?per_page=100" \
                   "environments/chrome-web-store/variables?per_page=100"; do
            echo "=== $p"
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | grep -iE '^HTTP|x-accepted-github-permissions' || true
          done

  actions-and-deployments-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: probe with actions+deployments read
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "environments/chrome-web-store" \
                   "environments/chrome-web-store/deployment-branch-policies?per_page=100" \
                   "environments/chrome-web-store/variables?per_page=100"; do
            echo "=== $p"
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | grep -iE '^HTTP|x-accepted-github-permissions' || true
          done

  write-all:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: probe with write-all (upper bound of a workflow token)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for p in "environments/chrome-web-store" \
                   "environments/chrome-web-store/deployment-branch-policies?per_page=100" \
                   "environments/chrome-web-store/variables?per_page=100"; do
            echo "=== $p"
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/$p" \
              | grep -iE '^HTTP|x-accepted-github-permissions' || true
          done
