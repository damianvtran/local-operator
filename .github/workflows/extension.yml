name: Browser extension

on:
  push:
    branches:
      # `main` only, matching ci.yml: a `dev-*` branch with an open PR fired this
      # workflow twice for the same commit (a push run and a pull_request run)
      # for one identical result. Paths-gating kept the volume low enough that
      # it never dominated the queue, but the duplication was the same defect
      # and is fixed the same way.
      - main
    paths:
      - 'extension/**'
      - 'local_operator/browser_bridge/protocol.py'
      - 'local_operator/browser_bridge/gen_ts.py'
      - 'local_operator/browser_bridge/resources.py'
      - 'local_operator/browser_bridge/backend.py'
      - 'local_operator/harness/types.py'
      - 'local_operator/harness/subagent.py'
      - 'local_operator/session/session.py'
      - 'local_operator/tools/builtin.py'
      - 'tests/e2e/test_browser_ownership.py'
      - '.github/workflows/extension.yml'
      # The store workflows are gated here because `release.test.mjs` asserts
      # their job topology (preflight has no `environment:`, the deploying job
      # `needs:` it). That guard is the primary boundary for an unattended
      # store release, and without this path a YAML-only edit deleting it would
      # never run the suite that catches it.
      - '.github/workflows/chrome-web-store.yml'
      - '.github/workflows/chrome-web-store-promote.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'local_operator/browser_bridge/protocol.py'
      - 'local_operator/browser_bridge/gen_ts.py'
      - 'local_operator/browser_bridge/resources.py'
      - 'local_operator/browser_bridge/backend.py'
      - 'local_operator/harness/types.py'
      - 'local_operator/harness/subagent.py'
      - 'local_operator/session/session.py'
      - 'local_operator/tools/builtin.py'
      - 'tests/e2e/test_browser_ownership.py'
      - '.github/workflows/extension.yml'
      - '.github/workflows/chrome-web-store.yml'
      - '.github/workflows/chrome-web-store-promote.yml'
  workflow_dispatch:

# Matches ci.yml, including the per-SHA group for `main` so a merge commit's
# run can never be evicted by the next merge. See the long note in ci.yml for
# why the SHA is in the key rather than `queue: max`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install host protocol and end-to-end dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        working-directory: extension
        run: pnpm typecheck
      - name: Run extension tests
        working-directory: extension
        run: pnpm test
      - name: Exercise session ownership through disposable protocol peer
        # No Chromium: Node runs the actual extension modules against isolated
        # Chrome API fixtures; Python drives its real Session and HTTP client.
        run: python -m pytest tests/e2e/test_browser_ownership.py -m e2e -n0 -q
      - name: Build extension
        working-directory: extension
        run: pnpm build
      - name: Verify generated protocol
        run: python -m local_operator.browser_bridge.gen_ts --check
      # Non-blocking on purpose. A stale list over-grants (a suffix registered
      # after PSL_GENERATED_AT is treated as a registrable domain) and also
      # strands stored keys, so drift must be VISIBLE — but the check fetches
      # publicsuffix.org, and an upstream blip or a legitimate new suffix must
      # not fail an unrelated PR. The release path enforces it: the submission
      # checklist requires a refresh before upload.
      - name: Check bundled Public Suffix List freshness (advisory)
        working-directory: extension
        continue-on-error: true
        run: node scripts/gen-psl.mjs --check
