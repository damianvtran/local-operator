# One operator-authorized diagnostic, never a standing privileged CI gate.
# The operator applies native-delegated-once-<exact-reviewed-head> once after
# wrapper/provenance/cleanup review. The wrapper verifies that head and these
# content hashes; any earlier run consumes the authorization (including relabel).
name: Native delegated relay update once
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  # Relabels serialize; the wrapper's read-only history check then fails closed.
  group: native-delegated-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delegated-diagnostic-once:
    if: >-
      startsWith(github.event.label.name, 'native-delegated-once-') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch the fixed base
        run: git fetch --no-tags origin main
      - name: Run the one authorized delegated diagnostic
        env:
          EXPECTED_HEAD: ${{ github.event.label.name }}
          EXPECTED_WRAPPER_SHA256: bf76296966a9a5b942796e2c8a5d23d0a04f0b7ad6cab7f35d60fe51a74f5083
          EXPECTED_PROBE_SHA256: 3963bdad593da823723035bac69264e8905b9e166cb09614d1e4520f119fe463
          EXPECTED_SCOPE_LIB_SHA256: ef92d8d7b34c8ea2d7e4e63e3a18201f58d4bcc3137ac6436a33d27915abc7ee
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/native-delegated-once-wrapper.sh
      - name: Upload scope and native receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-delegated-once
          path: |
            ${{ runner.temp }}/native-*.json
            ${{ runner.temp }}/native-*.rc
            ${{ runner.temp }}/native-*.log
          retention-days: 7
