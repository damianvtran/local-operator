# One operator-authorized diagnostic, never a standing privileged CI gate.
# The operator applies native-<exact-reviewed-head> once after
# wrapper/provenance/cleanup review. The wrapper verifies that head and these
# content hashes; any earlier run consumes the authorization (including relabel).
name: Native delegated relay update once
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  # Relabels serialize; the wrapper's read-only history check then fails closed.
  group: native-delegated-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delegated-diagnostic-once:
    if: >-
      startsWith(github.event.label.name, 'native-') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch the fixed base
        run: git fetch --no-tags origin main
      - name: Run the one authorized delegated diagnostic
        env:
          EXPECTED_HEAD: ${{ github.event.label.name }}
          EXPECTED_WRAPPER_SHA256: cca745bff0c639e93ae547f23524ce634083cc392ecd087b4a3c6be09fca00c5
          EXPECTED_PROBE_SHA256: bd22408a6fedb81b8f766669241d189cd6bd459303a7803daa22f593bdd19c68
          EXPECTED_SCOPE_LIB_SHA256: 1f7ad6a655ab1b4f28686262dc1da1126ab5f872aeaebb27beee5c83512e25b6
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/native-delegated-once-wrapper.sh
      - name: Upload scope and native receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-delegated-once
          path: |
            ${{ runner.temp }}/native-*.json
            ${{ runner.temp }}/native-*.rc
            ${{ runner.temp }}/native-*.log
          retention-days: 7
