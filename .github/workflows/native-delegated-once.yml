# One operator-authorized diagnostic, never a standing privileged CI gate.
# The operator applies native-<exact-reviewed-head> only for a head whose guard
# and fixture changes have been reviewed. The wrapper verifies that head and
# these content hashes; only the reviewed consumed failed runs and the current
# row may appear in history, so any other dispatch fails closed.
name: Native delegated relay update once
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  # Relabels serialize; the wrapper's read-only history check then fails closed.
  group: native-delegated-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delegated-diagnostic-once:
    if: >-
      startsWith(github.event.label.name, 'native-') &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch the fixed base
        run: git fetch --no-tags origin main
      - name: Run the one authorized delegated diagnostic
        env:
          EXPECTED_HEAD: ${{ github.event.label.name }}
          EXPECTED_WRAPPER_SHA256: 4a7349d6ff3d3cadc8d7afc388851deb25fdba5e5c69adbfffb9a3317b2a57ae
          EXPECTED_PROBE_SHA256: ae23c80d398bf204c630f1da9febacaf03f2cc1f31aa638aa4ccafac100b9ee5
          EXPECTED_SCOPE_LIB_SHA256: cd7c0e05a7e82c8e5b77be572a5705bf1488513fc823b0d13295af59cedf6303
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/native-delegated-once-wrapper.sh
      - name: Upload scope and native receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-delegated-once
          path: |
            ${{ runner.temp }}/native-*.json
            ${{ runner.temp }}/native-*.rc
            ${{ runner.temp }}/native-*.log
          retention-days: 7
