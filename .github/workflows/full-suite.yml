name: Main Full Suite

# THE FULL UNIT SUITE, AND THE PULL-REQUEST MERGE GATE.
#
# Pull-request CI used to run every unit shard on every push. Measured over
# 2026-10-24..11-07 (gh API): 89% of ci.yml's runner time was the unit suites
# (six `test` shards at 25.6 min mean, `tui-e2e`, `coverage-report`), the job
# queue they created had a 15.6 min median / 77 min p90 wait, and 25% of red
# outcomes went green on a plain re-run. So the full suite left the PUSH path:
# a PR carries targeted local evidence (`scripts/affected_tests.py --evidence`)
# plus ci.yml's fast `guards` job, and this workflow runs EVERYTHING once — on
# `main` as the post-merge safety net, and on a PR when a human or agent says
# the head is ready to merge.
#
# THE MERGE GATE. `merge-gate` below is the SECOND required check, alongside
# ci.yml's `CI Gate`: a PR cannot merge until the whole suite is green on its
# final head. Why a label-gated run and not a merge queue: GitHub's merge queue
# is unavailable to this repository — `repository.mergeQueue` is null via
# GraphQL, `enableMergeQueue` does not exist on it, and the feature is limited
# to public repos owned by an ORGANISATION (this one is user-owned) or
# Enterprise Cloud private orgs. The label is the queue, and the aggregate job
# is the gate.
#
# The three ways this design could report a PASS it did not earn, each closed
# below (the reasoning lives in comments, not only in the code):
#   1. A job that can be SKIPPED must never own a required check name, because
#      GitHub counts `skipped` as satisfying a required status check. So no
#      suite job and no aggregate carries a label-name `if:` — any label starts
#      one full run, and an accidental label then costs a run, never a false
#      pass.
#   2. A required check that never reports sits in "Expected" and blocks. That
#      is the intended block, but it must always be exitable: the documented
#      ritual (`make merge-gate PR=<n>`, which removes and re-adds the label)
#      always produces a run.
#   3. A push after the gate ran leaves the check on the OLD head, which blocks
#      again — the ritual re-arms it on the final head.
#
# The job definitions below were MOVED here from ci.yml, not rewritten: their
# timeouts, watchdogs, serial-control lists and artifact steps are measured and
# pinned by tests/unit/test_ci_hygiene.py and the shard-stall tests, which now
# read this file for those jobs. The only edits are the ones the move forces:
# the python matrix is both legs unconditionally (no `pull_request` leg of the
# old push-triggered run exists here) and `tui-e2e` no longer needs
# lint/type-check (PR-only jobs).
#
# What this run catches that targeted PR runs cannot, and why each needs a FULL
# run rather than a bigger selection: matrix-version bugs (3.13 only), cross-test
# state leaks that only show under sharded `-n auto` worksteal ordering, and any
# test the diff-to-test mapping did not reach. On `main` it does NOT block a
# PR: a red run is itself the signal (no issue is filed; the author of the
# merge commit and the periodic sweep follow it). On a PR it DOES block, through the
# `merge-gate` aggregate below.

on:
  push:
    branches:
      - main
  schedule:
    # 07:17 UTC daily: off-peak for this repo's merge traffic (late evening US
    # Pacific), and off the top of the hour, where GitHub's scheduler is most
    # congested and drops or delays `schedule` events.
    - cron: "17 7 * * *"
  workflow_dispatch:
  # THE MERGE GATE TRIGGER. ONLY `labeled`. `opened`/`synchronize`/`reopened`
  # would put the full suite back on every push and every review round — the
  # cost this workflow exists to avoid — so review rounds run ci.yml's fast
  # checks and nothing else. `labeled` is the operator's "ready to merge"
  # signal; `make merge-gate PR=<n>` is how it is re-armed after a push.
  pull_request:
    types: [labeled]

# ONE running plus the NEWEST pending, never a queue. GitHub keeps a single
# pending run per group and a newer arrival replaces it, so with
# `cancel-in-progress: false` a burst of merges costs at most two full runs and
# the pending one always tests the tip of `main`. That is the intent: this run
# answers "is main green?", and an intermediate commit's answer is subsumed by
# its successor's (the post-merge blame window is the commits between the last
# green and the first red SHA, which the issue names).
#
# `workflow_dispatch` runs on ANY ref: an agent whose PR touches test infra
# (conftest, run_bounded, ci_scope, pytest plugins — `scripts/affected_tests.py`
# prints a `WIDE:` directive for these) requests the full suite on its branch
# with `gh workflow run full-suite.yml --ref <branch>`. The group is keyed by
# ref, so a branch dispatch can never evict main's pending run; on `main` the
# key is the fixed `full-suite-main`.
#
# PR runs are keyed by `refs/pull/<n>/merge`, which is already distinct per PR,
# so a gate run cannot evict another PR's run either. `cancel-in-progress:
# false` matters most here: a queued gate run must never be evicted by the
# nightly schedule or by a later merge onto main — an evicted run reports no
# verdict, and the PR's required check would sit "Expected".
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'full-suite-main' || format('full-suite-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same classifier job as ci.yml (kept identical; a hygiene test compares the
  # two). Off `pull_request` every flag is true, so a push/schedule/dispatch
  # run never skips anything. A labeled PR is a real PR diff, and classifying
  # it is WANTED: a docs-only head may skip the unit matrix and still pass the
  # merge gate (a skip is a verdict, not a silent pass — the gate refuses a
  # failed or cancelled job). It exists here so the moved jobs keep their
  # `needs: [changes]` + flag wiring byte-for-byte.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.classify.outputs.lint }}
      types: ${{ steps.classify.outputs.types }}
      budget: ${{ steps.classify.outputs.budget }}
      unit: ${{ steps.classify.outputs.unit }}
      packaging: ${{ steps.classify.outputs.packaging }}
      tui: ${{ steps.classify.outputs.tui }}
      windows: ${{ steps.classify.outputs.windows }}
      xplat: ${{ steps.classify.outputs.xplat }}
      audit: ${{ steps.classify.outputs.audit }}
      cli: ${{ steps.classify.outputs.cli }}
      server: ${{ steps.classify.outputs.server }}
      i18n: ${{ steps.classify.outputs.i18n }}
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 must be present. Two commits is the whole requirement, as in
          # version-bump-guard.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Classify the change
        id: classify
        # No `pip install`: the classifier imports stdlib only, so a broken
        # dependency resolution can never decide what runs. Same argument as
        # version-bump-guard's "a guard that needs an install is a guard that
        # goes red for reasons unrelated to versions".
        run: |
          set -uo pipefail
          base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci_scope.py" 2>/dev/null; then
            git show "$base:scripts/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
            python "$RUNNER_TEMP/ci_scope.py" \
              --event "$GITHUB_EVENT_NAME" --base "$base" \
              --root "$GITHUB_WORKSPACE" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Change classification unavailable::no classifier at the base commit, so this diff cannot be classified. Running every job rather than guessing."
            python scripts/ci_scope.py --all --root "$GITHUB_WORKSPACE" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
          fi

  test:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.unit != 'false'
    runs-on: ubuntu-latest
    # Keep six shards within the 20-job concurrency budget. PR #643 job
    # 101250352578 reached 97% before GitHub cancelled it at the 15-minute
    # limit, so the ceiling carries setup and the long tail without dropping
    # tests, coverage, or the independent per-test/e2e watchdogs.
    #
    # 20 -> 25 on 2026-09-28, because the ceiling was cancelling HEALTHY
    # shards: across the last 45 main runs, eight shard jobs were cancelled --
    # every one of them at 20.1-20.3 minutes, and every one with a clean
    # verdict from the stall watchdog below. Five dumps read `timer armed but
    # never fired` (no item exceeded its 240s bound); the other three read
    # `no shard stall report: nothing stalled long enough to trip the
    # watchdog`. Five shards were killed with their last progress at 99%;
    # three had ALL their tests green (0:19:12 / 0:19:28 / 0:19:34) when the
    # cap fired at the artifact-upload step. The heaviest SUCCESSFUL shards in
    # that window ran up to 19.98 minutes (top six: 19.98 / 19.95 / 19.83 /
    # 19.80 / 19.77 / 19.70), so 20 sat inside the healthy tail; 25 leaves the
    # worst observed healthy shard ~5 minutes of headroom. The weight skew
    # this also exposes (heavy shards 0/2/4 around p50 17.0-17.7 against
    # 13.5-15.6 for shards 1/3) is a manifest question, not a ceiling one --
    # see scripts/gen_test_durations.py.
    #
    # 25 -> 26 on 2026-10-12, because the guard reads the CI checkout and a
    # pull_request checkout is the MERGE ref: #2294's merge ref carries 15 test
    # files this branch does not, none of them measured, so each runs at the
    # 30.786s fallback. The balanced partition spreads those 461.79s of added
    # weight to +92.358s (three fallbacks) on every shard, and the heaviest
    # reaches 5771.255s of serial weight -- 1442.81s on 4 workers, 2.81s past
    # the 1440s budget at 25. 26 is the guard's own minimum,
    # ceil((1442.81 + 60)/60); the job that tripped it reported 761.59s of
    # pytest, so the ceiling still sits well above measured walls.
    #
    # 26 -> 27 on 2026-10-14, for the same reason one tree later: origin/main
    # alone already sat at 5994.758s of serial weight (1498.69s on 4 workers,
    # 1.31s inside the 1500s budget at 26), and #2385's merge ref adds one
    # unmeasured test file at the 30.786s fallback, taking the heaviest shard
    # to 6001.689s -- 1500.42s, 0.42s past the budget. 27 is the guard's own
    # minimum, ceil((1500.42 + 60)/60); measured walls are still far below it.
    # Leave growth margin: the 2026-10-15 merge refs project up to 1562.952s
    # plus 60s setup overhead, exceeding the former 27-minute ceiling.
    # Thirty minutes left 177s of headroom at that tree. P3a's test growth
    # projects 1741.21s on the heaviest shard, just beyond the 1740s test
    # budget at 30 minutes after setup. 31 is the guard's minimum ceiling:
    # ceil((1741.21 + 60)/60). Weights, workers, partition and watchdogs stay
    # unchanged; this is scheduling headroom, not a test-failure waiver.
    #
    # 32 (2026-10-19 and 2026-10-21), twice over and by the same one-line change. The
    # credential-repair slices' new test files run at the manifest's 30.786s
    # fallback and push the heaviest shard to 7202.00s of serial weight
    # (1800.39s on 4 workers), 0.39s past the 1800s budget at 31. At the same
    # time the composed main-recovery change measures 7239.26s serial
    # (1809.82s on 4 workers), 9.82s past that same budget. The larger figure
    # dominates, and 32 is the guard's own minimum: ceil((1809.82 + 60)/60),
    # passing by 50.18s. Both sides carried the identical `timeout-minutes: 32`
    # and only the prose differed, so this merges the two rationales rather
    # than raising the ceiling a second time. Weights, workers, partition and
    # watchdogs remain unchanged.
    #
    # 32 -> 38 on 2026-10-28, and unlike every step above this is NOT a guard
    # minimum: `shard_tests.py --report` projects the heaviest shard at 86.4
    # serial test-minutes (~1296s on 4 workers), so the guard's minimum is
    # ceil((1296 + 60)/60) = 23, well below 32. The ceiling is raised for
    # runner speed variance instead. Measured from the API over 59 CI runs
    # (378 shard jobs, 13:36Z-21:00Z): success walls by shard, p50/p90/max in
    # minutes, were s0 27.2/28.8/29.1, s1 25.6/31.7/31.9, s2 26.9/30.6/31.3,
    # s3 27.0/28.9/29.6 and s4 25.1/31.6/31.9. Eighteen jobs were cancelled at
    # 32.0-32.9 minutes by this ceiling (seven on main, fifteen of them
    # shard 1). Twelve of those had already printed a green pytest summary
    # (1848-1882s of test time) and were cut in the ~0.1-minute tail; the
    # other six were at 99% progress. Identical files swing by runner:
    # #3087's shard 1 ran 12436 passed in 1881.59s and was cancelled at 32:15
    # on attempt 2, then the SAME files passed in 1212.19s (21:11 wall) on
    # attempt 3. That 1.55x swing is runner-side, so this buys protection
    # against slow runners and is not a waiver for a test-cost regression.
    # Formula: worst healthy wall W = 32.38 minutes (the slowest job to reach
    # a green pytest summary, at 32.23, plus the slowest observed 0.15-minute
    # tail), and 38 = ceil(1.15 * W). That also covers the worst cut-off run
    # projected to completion (99% at 31.92 plus the slowest observed 3.50
    # minutes from 99% to the summary, about 35.4). Weights are relative and
    # the guard passes, so reweighting moves no runner's speed. More shards
    # would spend the 20-job concurrency budget. Weights, workers, partition,
    # and the per-test and stall watchdogs are unchanged.
    # Six-shard weight repair: retain that 38-minute cap and every selected
    # test/coverage path. Three complete attempt-bound CI runs supply per-file
    # p75 weights; their LPT test-time sums are NOT wall-time margin evidence.
    # See docs/ci-test-durations.md for provenance and post-change limits.
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        # BOTH ends of `requires-python`, always: this workflow runs only on
        # `main` (post-merge, nightly, dispatch), so the version-class
        # regressions a 3.12-only PR run cannot see (a 3.13-only deterministic
        # failure was caught exactly this way) are caught here.
        python-version: ["3.12", "3.13"]
        shard: [0, 1, 2, 3, 4, 5]
    env:
      # Seconds of no completed test before the controller reports which tests
      # are still in flight, and the per-item bound after which a worker dumps
      # every thread's stacks. Four shards have been cancelled at the 20-minute
      # cap after a silent 6-minute tail (5m55s-7m18s of zero output) which the
      # log cannot attribute: `-q` prints one line per 72 completed tests, so
      # the last partial line is withheld until its slowest item finishes.
      #
      # 240s is chosen against measurements, not taste. This budget is a CI
      # number, as AGENTS.md requires: the worst legitimate test measured in a
      # full local run is 81s, and a shard averages ~0.2s per completed test, so
      # four minutes with NO completion is already anomalous rather than slow.
      # It also has to fire with time to spare before the cap: the observed
      # stalls begin ~14 minutes into the job, so 240s puts the first report at
      # ~18 minutes, and the 30s repeat still gets several more prints before
      # the 26-minute ceiling.
      LOCAL_OPERATOR_SHARD_STALL_SECONDS: "240"
      # THE SIX SERIAL CONTROLS — one list, read by every step below and by
      # `tests/unit/test_ci_hygiene.py`. They hold REAL threads, a real child
      # process in its own session and real loopback sockets, and flaked when
      # scheduled among ~1,700 files under `-n auto` on a shared runner (store
      # walk: the walker finished before the observer ran; status verb: a
      # legitimate admit-time pass published into a cache the cell assumed
      # empty). They are deselected from EVERY shard's xdist run and run once,
      # serially (`-n0`), in a follow-up step of shard 0 only. Coverage is the
      # union of both, so nothing is skipped; each case runs exactly once.
      # `--deselect` is a PREFIX match on the node id, so the hygiene test also
      # proves no other test name begins with any of these.
      SERIAL_CONTROLS: |
        tests/unit/test_session_factory.py::test_a_leaving_runtime_stops_the_store_walk_at_a_directory
        tests/unit/test_session_factory.py::test_cell_a_control_the_old_observer_setup_fails_its_precondition
        tests/unit/test_session_factory.py::test_cell_a_control_a_consumer_that_ignores_a_set_stop_runs_the_walk_to_the_end
        tests/unit/network/test_membership_convergence.py::test_the_status_verb_asks_over_the_control_socket_for_a_fresh_pass
        tests/unit/network/test_membership_convergence.py::test_status_verb_control_a_dropped_refresh_field_is_rejected_for_not_asking
        tests/unit/network/test_membership_convergence.py::test_status_verb_control_the_old_empty_assertion_fails_after_a_legitimate_pass
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install ripgrep
        # The ubuntu runner image ships no `rg`, and grep's real-ripgrep tests
        # (`_grep_on_engine(..., "rg", ...)` in tests/unit/tools/test_builtin_tools.py)
        # SKIP without it, so the engine most users run went untested in CI while
        # the job stayed green (review N1 on #2982). The version print puts proof
        # in the log that the binary those tests find is really there.
        #
        # A pinned upstream release tarball, checksum-verified, rather than apt:
        # `apt-get update` fetched a 3.6 MB index (7-18 s per shard) from a mirror
        # the PR cannot control, could hang with no bound, and installed whatever
        # version the runner image's archive carried (review R2 on #2997). The
        # static musl build has no runtime dependencies. Fail-hard on purpose: a
        # silently missing rg is what let the rg tests skip green before. Bump by
        # changing RG_VERSION and RG_SHA256 together (the `.sha256` asset beside
        # the tarball on the GitHub release).
        #
        # Download retries 5xx/network errors with backoff and falls back to a
        # verified local rg (scripts/ci_install_ripgrep.sh); 4xx and checksum
        # mismatch still fail hard. Budget 3 min covers the ~105 s worst case.
        timeout-minutes: 3
        env:
          RG_VERSION: "15.1.0"
          RG_SHA256: "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599"
        run: bash scripts/ci_install_ripgrep.sh

      - name: Partition test suite
        # Balanced by MEASURED per-file duration (tests/durations.json), not by
        # sort position. The old `i % 5` split balanced the file COUNT, which in
        # a suite whose per-file cost spans four orders of magnitude produced a
        # 4.16x spread: the heaviest shard projected 81.7 test-min against 19.6
        # for the lightest, and ran 19.2 min against this job's cap (then 20 minutes).
        #
        # Worse, the index was positional, so adding ONE test file re-dealt
        # every later file and the slow cluster MIGRATED between shards. A PR
        # adding one file was reported as a failure with `3693 passed` in its
        # log (cancelled at the cap), while one adding six files finished in
        # 8m46s. Risk was uncorrelated with what the author did.
        #
        # `--dist worksteal` in addopts cannot fix this: it rebalances within
        # one pytest process, and this split happens across six machines
        # before pytest starts. The full reasoning, the determinism argument,
        # and why a file missing from the manifest still runs are in
        # scripts/shard_tests.py.
        run: |
          python scripts/shard_tests.py \
            --shard ${{ matrix.shard }} --total 6 --out shard_tests.txt

      - name: Run test shard with coverage
        id: shard_pytest
        # `LOCAL_OPERATOR_SHARD_MEMORY_DIR` is where `tests/shard_memory_dump.py`
        # writes an ENOMEM snapshot when a cell dies of `OSError: [Errno 12]`.
        # It is set HERE, on the pytest step, because the `runner` context is not
        # available at job-level `env`; the serial-controls step and the upload
        # step spell the same path again and all three must stay in step. Under
        # `runner.temp` on
        # purpose: the dump must never land in the checkout (a test run writing
        # into the repo tree is its own defect), and an absolute path is what
        # `upload-artifact` documents as supported. The shard and attempt are in
        # the directory name so a later attempt cannot mix evidence with an
        # earlier one.
        env:
          # Step-local: a later serial pytest invocation must not share this ID.
          LOCAL_OPERATOR_SHARD_STALL_INVOCATION: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}-${{ matrix.shard }}
          LOCAL_OPERATOR_SHARD_MEMORY_DIR: ${{ runner.temp }}/lo-shard-memory/${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
        # Module invocation makes the checkout importable before -p resolves the
        # ordering plugin without exporting PYTHONPATH=. to spawned interpreters.
        # That relative entry would defeat their -P cwd-import isolation.
        # The six serial controls are deselected here (see SERIAL_CONTROLS above).
        # The `.coverage` rename is NOT done here any more: shard 0 appends the
        # serial run's data to this file first, so the rename moved to the
        # finalisation step below, after every pytest step of this job.
        run: |
          # Allocate before test code starts; worker configure records the actual
          # writer inode here, not in mutable fixture/dump directories. This is
          # provenance against ordinary fixtures, not a same-uid Python sandbox.
          registry=$(mktemp -d "$RUNNER_TEMP/lo-stall-owners.XXXXXX")
          echo "stall_registry=$registry" >> "$GITHUB_OUTPUT"
          export LOCAL_OPERATOR_SHARD_STALL_REGISTRY="$registry"
          python -m pytest -p tests.ci_order_owned_first \
            $(cat shard_tests.txt | tr '\n' ' ') $(printf -- '--deselect %s ' $SERIAL_CONTROLS) \
            --cov --cov-fail-under=0 --cov-report= \
            --junit-xml=junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml

      - name: Prove the serial controls were deselected from this shard
        id: serial_absent
        # Every shard, including those whose file list never held the two files:
        # an XML that names one of the six means the deselect failed and a case
        # is about to run twice (or under xdist, which is what is being avoided).
        # `always()` so a failing ordinary run still reports it; a missing or empty
        # XML is BLOCKED (exit 2), never a pass.
        if: always() && steps.shard_pytest.outcome != 'skipped'
        run: |
          python scripts/check_serial_controls.py absent \
            --junit junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml \
            --ids "$SERIAL_CONTROLS"

      - name: Run the serial controls once (shard 0)
        id: serial_controls
        # DISPATCH REQUIRES SUCCESS, not merely "not cancelled": the implicit
        # `success()` means setup, the ordinary shard run AND the absence proof all
        # passed. An unrelated failure on this shard therefore leaves the serial
        # proof BLOCKED rather than running the cases against a broken tree, and
        # no `continue-on-error` masks anything. Only shard 0 runs them: one
        # execution per python leg (a PR is the 3.12 leg only; `main` also runs 3.13).
        #
        # THE BOUND. `timeout-minutes: 7` is a declared, UNMEASURED ceiling (the
        # six cases build a 60-directory synthetic store three times and two relay
        # pairs), not a speed claim: shard 0's budget is the heaviest shard's
        # modelled wall plus this full 420 s, asserted by test_ci_hygiene. Inside
        # it, `run_bounded` puts pytest in its own process group and escalates
        # SIGTERM -> SIGKILL on the bound (--timeout 400 --grace 10 fits under the
        # 420 s step). The store-walk child is in a NEW SESSION by design and is
        # outside that group, so it carries its own parent-death guard (it exits
        # within a second of pytest disappearing); a step timeout therefore leaves
        # no native child behind. `--memory-mb 0` is passed EXPLICITLY because this
        # job has no memory policy today: nothing else in it is capped, and a cap
        # guessed for six untimed cases could kill a healthy test, so none is invented.
        # The wrapper reports it as "memory guard disabled (explicit)". No inherited
        # positive CI budget was verified here, and Ubuntu's ability to measure memory
        # is not the reason; a real cap is a separate, measured decision.
        #
        # COVERAGE: the exact source of the ordinary run, appended to its data.
        # A bare `--cov` would reset the selection; `--cov-fail-under=0` and the
        # empty report keep the gate where it already is (the combine job).
        if: matrix.shard == 0
        timeout-minutes: 7
        # Same dump directory as the ordinary shard run, so an ENOMEM in this
        # -n0 stage lands in the one artifact the shard job uploads. `runner` is
        # not available at job-level `env`, hence the repetition.
        env:
          LOCAL_OPERATOR_SHARD_MEMORY_DIR: ${{ runner.temp }}/lo-shard-memory/${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
        run: |
          python scripts/run_bounded.py --timeout 400 --grace 10 --memory-mb 0 -- \
            python -m pytest $SERIAL_CONTROLS -n0 -q \
            --cov=local_operator --cov-append --cov-fail-under=0 --cov-report= \
            --junit-xml=junit-serial-controls-${{ matrix.python-version }}-0.xml

      - name: Prove the serial controls ran once, with their receipts
        id: serial_proof
        # `always()` for the same reason as the upload below: a serial step that
        # FAILED (or hit its bound) still wrote what it wrote, and a missing XML
        # must read BLOCKED here rather than vanish. Skipped when the serial step
        # was never attempted (every shard but 0, or a broken ordinary run).
        if: always() && steps.serial_controls.outcome != 'skipped'
        run: |
          python scripts/check_serial_controls.py present \
            --junit junit-serial-controls-${{ matrix.python-version }}-0.xml \
            --ids "$SERIAL_CONTROLS"

      - name: Finalise shard coverage data
        # AFTER the serial step: the rename that used to end the ordinary run.
        # Default `success()`, as before: a failed shard uploads no coverage and
        # the combine job is skipped, exactly as when pytest alone failed.
        run: mv .coverage .coverage.${{ matrix.python-version }}.${{ matrix.shard }}

      - name: Upload junit timings
        # WHY THE SUITE PAYS FOR A JUNIT FILE EVERY RUN: this is the only
        # channel that turns committed shard weights into MEASURED ones on
        # dedicated hardware. `tests/durations.json` is currently measured on a
        # developer machine, whose load distorts the event-loop-bound TUI files
        # that carry 82% of the tree's weight (scripts/gen_test_durations.py
        # says so and names CI as the better source, blocked only because the
        # workflow emitted nothing to read). With this artifact,
        # `gh run download <run> -n junit-timings-<py>-*` then
        # `python scripts/gen_test_durations.py --tree unit --junit '*.xml'`
        # regenerates the manifest from the run that actually suffered the
        # imbalance — no local full-suite run needed.
        #
        # `if: always()` is deliberate, and its reach is narrower than it looks.
        # It covers the FAILING case: an ordinary pytest failure exits 1 and
        # still writes the XML, with `failures="1"` and per-test times for
        # everything that ran, which is a run whose weights want correcting.
        #
        # It does NOT cover the case this job actually cares about: a shard
        # that HANGS. A `faulthandler` bound is diagnostic (`exit=False`) and a
        # process wedged with the GIL held cannot be reached from Python, so
        # such a shard is ended from outside the interpreter and never reaches
        # pytest's `sessionfinish`, where the JUnit file is written -- there is
        # then no file to upload, and `if-no-files-found: ignore` means the
        # step reports success with an empty artifact. Measured both ways on
        # 2026-09-19: a failing test leaves `failures="1"` in the XML, while a
        # process ended from outside leaves no XML at all (the shape measured
        # was `os._exit(1)`, which skips `sessionfinish` the same way).
        #
        # Cancellation is deliberately NOT claimed either way. It is a third
        # exit path this change did not measure, and the two signals differ: a
        # round-2 review measured that SIGINT (which is how GitHub's
        # documented cancellation begins) leaves the XML, while SIGTERM does
        # not. The two cases above are what this rationale rests on.
        # A hung shard's timings are therefore NOT recoverable from this
        # artifact; the weights for such a run come from a healthy one.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-timings-${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          # Keep the timing XML and real-App proof contracts intact. Quiet-turn
          # proof JSON is schema-filtered and capped at 96 KiB per file: no
          # prompt/transcript bodies, secrets, or arbitrary fixture scratch.
          # Native churn failure JSON is diagnostic-field-only and capped at
          # 96 KiB; preserve it even when the original pytest tmp_path is gone.
          # Never upload an entire test-artifact directory or working tree.
          path: |
            junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml
            junit-serial-controls-${{ matrix.python-version }}-0.xml
            test-artifacts/tui-proof/**/*.svg
            test-artifacts/tui-proof/**/*.geometry.json
            test-artifacts/tui-proof/manifest.json
            test-artifacts/quiet-proof/*.json
            test-artifacts/process-proof/*.json
          # 7 days, not 1: post-hoc flake/review evidence reads must survive past
          # the next day (PR #2470: XML expired at ~24.5 h, forced a re-run).
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload shard memory dumps
        # WHY `always()`: the dump exists only on the run where a cell died of
        # ENOMEM, and that run is a FAILED job -- a default `success()` condition
        # would upload exactly when there is nothing to see. A healthy shard
        # writes no file, so `if-no-files-found: ignore` keeps this step green.
        #
        # The path and name repeat the shard step's `LOCAL_OPERATOR_SHARD_MEMORY_DIR`
        # (the `runner` context cannot be used in job-level `env`). The attempt
        # number is in both: a re-run must be distinguishable from the run it
        # replaces, because the memory reading of one attempt is not evidence
        # about another.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-memory-${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lo-shard-memory/${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Stage current-invocation timeout files
        id: stage_stall
        if: always()
        env:
          LOCAL_OPERATOR_SHARD_STALL_REGISTRY: ${{ steps.shard_pytest.outputs.stall_registry }}
          LOCAL_OPERATOR_SHARD_STALL_INVOCATION: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.python-version }}-${{ matrix.shard }}
        # Security allowlist: only registered writer inodes from this invocation,
        # no symlink inputs or arbitrary scratch; 1 MiB/file, 8 MiB/32 files total.
        # Existing timeout text may expose fixture paths, so keep only one day.
        # This does not capture locals/env/argv or guarantee a fatal-crash stack.
        run: |
          # Never reuse/remove a pre-existing tree. Publish the new path ONLY
          # after the collector validates it and exits successfully. Error/partial
          # manifests remain local; a failed stage never authorizes an upload.
          set -euo pipefail
          staging=$(mktemp -d "$RUNNER_TEMP/lo-stall-stage.XXXXXX")
          python -m tests.shard_stall_artifact \
            --root "${TMPDIR:-/tmp}/lo-shard-stall" \
            --invocation "$LOCAL_OPERATOR_SHARD_STALL_INVOCATION" \
            --registry "$LOCAL_OPERATOR_SHARD_STALL_REGISTRY" \
            --output "$staging/artifact"
          echo "artifact=$staging/artifact" >> "$GITHUB_OUTPUT"

      - name: Upload current-invocation timeout files
        if: always() && steps.stage_stall.outcome == 'success' && steps.stage_stall.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: shard-timeout-files-${{ matrix.python-version }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.stage_stall.outputs.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Print the shard stall report
        # `always()` unconditionally: the report exists exactly when this job is
        # cancelled at the cap or dies, and `always()` is the one condition that
        # still runs then. It is belt-and-braces rather than the delivery path
        # -- the controller prints its report straight to this log while the
        # stall is happening, because that is the only channel a cancelled job
        # leaves intact -- but it also covers a device-level failure nothing
        # printed, and a fired worker stack dump in the case where the shard
        # step failed rather than timed out.
        #
        # The printing is done by the module (`report_dumps`), not by `cat`, and
        # that is load-bearing rather than cosmetic: a worker writes its header
        # at ARM time, one per test, so a raw dump of this PR's own cancelled
        # shard held 3088 lines all reading "<nodeid> exceeded 240s" with the
        # one real timeout buried among them. The module's FIRED_MARKER filter
        # is the single source of truth for "this is evidence", so the step asks
        # for the filtered report instead of re-implementing the rule in YAML.
        if: always()
        run: |
          python -m tests.shard_stall_watchdog "${TMPDIR:-/tmp}/lo-shard-stall"

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
          retention-days: 1
          include-hidden-files: true

  # `coverage-report` is deliberately left with `needs: test` and NO `if:`, and
  # that is the whole disposition — do not add `always()` for symmetry with the
  # gated jobs above. GitHub's default ("a skipped need skips the dependent") is
  # exactly right here: a docs-only PR must not run a coverage combine over
  # zero shard artifacts. An `always()` would do precisely that and go red on a
  # PR that changed nothing the test job reads.
  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-${{ matrix.python-version }}-*
          merge-multiple: true

      - name: Combine coverage and check threshold
        run: |
          ls -la
          coverage combine .coverage.${{ matrix.python-version }}.*
          coverage report --fail-under=80
          coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
          retention-days: 7

  tui-e2e:
    # Moved from ci.yml with `needs: [changes, lint, type-check]`; lint and
    # type-check stay on PR CI and do not exist in this workflow, and every
    # commit reaching `main` already passed them on its PR.
    needs: [changes]
    # `!cancelled()` is required, not decoration: `needs` skips a job when a
    # needed job was SKIPPED, and GitHub applies an implicit `success()` to any
    # `if` that contains no status-check function. Without it, lint's deliberate
    # skip on an inert diff would skip the freeze guard — the #426 defect in a
    # new costume. The explicit `.result == 'success'` clauses restore the other
    # half: a FAILED lint or type-check still blocks this job.
    #
    # BOTH platforms, and macOS is the one that makes this job worth having.
    #
    # This job exists because a FULLY GREEN unit suite did not catch a total
    # event-loop freeze. PR #401 fixed a deadlock in the MCP OAuth refresh
    # lock: an unbounded blocking `fcntl.flock` on a worker thread, then
    # `os.close(fd)` on the event-loop thread during cancellation. 8000+ unit
    # tests passed throughout, because every piece was individually correct and
    # NOTHING drove the assembled application. This stage drives it.
    #
    # The deadlock is a macOS/BSD property: `close()` blocks there while a
    # sibling thread is parked in `flock()` on that descriptor, and on Linux it
    # simply returns. That is measured, not assumed — the same probe reports
    # `close_blocked=True` on darwin and `close_blocked=False` (7.4 us) on
    # linux. Running the resume test against the PRE-FIX tree (80df237b^) in
    # `python:3.12-slim` gives `1 passed`, RC=0: the regression test passes
    # against the regression. Sampling `sys._current_frames()` through that run
    # catches the worker parked in `_lock_exclusive`, so the lock IS contended
    # on Linux and the cancellation does happen — the loop just never wedges.
    #
    # So an ubuntu-only wiring would have shipped this stage green against the
    # very commit it was built to catch. macOS is therefore not a nice-to-have
    # leg: it is the only platform where the freeze guard can go red at all.
    # Linux stays because the rest of the stage is genuinely platform-neutral
    # (boot, the write-turn artifacts, the transcript replay and the
    # interactivity assertion) and it is the faster, always-available runner.
    #
    # `fail-fast: false` so a macOS queue delay or a Linux-only regression each
    # report on their own rather than cancelling the other leg's evidence.
    #
    # TWO axes, and each one answers a different requirement.
    #
    # `os` is the guard's own requirement: macOS is the only platform where the
    # #401 event-loop freeze can go red at all (see the long note above), so
    # dropping the leg disarms the stage. Both OSes run every shard.
    #
    # `shard` is how this stage stopped being the longest job in the run. The
    # whole tree ran serially on each leg — `-n0` is required (a hang cannot be
    # interrupted in-process, so a wedged xdist worker strands the whole run and
    # reports a freeze as an infrastructure error) — and
    # measured `184 passed, 7 skipped ... in 1111.95s` on run 35414372114: 19.1
    # and 19.8 min, the critical path of the entire workflow. Splitting the
    # TREE across RUNNERS is the one axis that leaves the `-n0` requirement
    # untouched: each matrix leg is its own machine, with its own process, its
    # own `flock` files and its own app lifecycles, so no shard can see a
    # sibling's hang.
    #
    # WHY TWO SHARDS, and what the trade is. This matrix was three shards
    # until 2026-10-19, and the trade was recorded then: three bought earlier
    # freeze-guard feedback and cost two more jobs per run, on the explicit
    # understanding that "if runner queue pressure becomes the binding
    # constraint, `shard: [0, 1]` with `--total 2` restores the job count at
    # the same critical path". Runner queue pressure then became the binding
    # constraint, and this is the trade being taken.
    #
    # The critical path is unchanged, and that is the property three shards
    # were buying. At two shards the heaviest e2e leg projects 1165.8350s
    # (19.4 min) on one worker, against the unit shard's 1805.1008s (30.1
    # min) on 4, so the freeze guard still lands first. (The "~7.5 min per
    # leg" figure below was measured on run 35420676112, when the e2e tree was
    # half this size; the leg grew with it, and the number that matters now is
    # the projection above.)
    #
    # What it costs is two jobs per run, and the two it costs are the ones the
    # account cannot afford: HALF of this matrix's jobs land on macOS, whose
    # concurrent-job cap is 5 for the WHOLE ACCOUNT, so 22 in-flight pull
    # requests were asking for 66 macOS jobs to compete for 5 slots. Two
    # shards ask for 44.
    #
    # The job count this matrix contributes to a pull request went from 6 to
    # 4, against the ~20-job account-wide budget the `test`
    # job's comment names, on main from 20 to 24. That is a deliberate trade,
    # not an oversight: if runner queue pressure becomes the binding constraint,
    # `shard: [0, 1]` with `--total 2` restores the job count at the same
    # critical path — which is why the matrix and `--total` are asserted equal
    # in tests/unit/test_ci_hygiene.py rather than kept in sync by hand.
    #
    # AND THAT TRADE WAS TAKEN, on 2026-10-19, because the account-wide runner
    # pool turned out to be the binding constraint. Measured across the three
    # active repositories: 26-28 workflow runs in flight, 53-118 jobs queued,
    # a median pending-job AGE of 25.8 min (p90 35.0, max 48.8), and a
    # four-minute sample in which zero jobs started. This stage is the worst
    # offender because HALF of its jobs land on macOS, and macOS has its own
    # cap of 5 concurrent jobs for the WHOLE account (the standard-runner
    # table: Pro is 40 total and 5 macOS) -- so 22 in-flight pull requests
    # asked for 66 macOS jobs to compete for 5 slots. Two shards ask for 44.
    #
    # It is still NOT the critical path, which is the property three shards
    # were buying. At 2 shards the heaviest e2e leg projects 1165.8350s
    # (19.4 min) on one worker, against the unit shard's 1805.1008s (30.1 min)
    # at this tree, so the freeze guard still finishes before the unit suite
    # does. The coverage is unchanged either way: the same e2e tree, the same
    # two platforms, the same test files -- only the partition differs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    # NO fork gate, deliberately, unlike cli-sanity/server-sanity below. Those
    # need a real OpenRouter key, so they are skipped on fork PRs that cannot
    # have one. This job is scripted end to end — no key, no network, no model
    # — so it runs on every pull request whose diff is NOT INERT, forks included.
    # It still carries no fork gate; what changed with scope gating is only that
    # a diff touching nothing but `docs/**` (or the mobile-web subproject) does
    # not run it — and because the matrix includes macOS, a fork contributor
    # reintroducing the deadlock sees it go red on their own PR on the macOS
    # leg. Both halves are load-bearing: a secrets-gated job could not reach
    # forks at all, and a Linux-only job would reach them and report green.
    #
    # Headless in the sense this job depends on: no display server, no window
    # and no `xvfb`. Most of the stage drives Textual's `run_test()` pilot into
    # an in-memory compositor, and the rest (`test_terminal_close_survives_e2e`,
    # `test_tui_boot_e2e`) allocates its own pty and drives the real console
    # script — so the runner still supplies no terminal, and this must never
    # grow a real browser or display dependency.
    #
    # lint + type-check only. This job is the freeze regression guard (#401);
    # it exists BECAUSE a green unit suite did not catch a total event-loop
    # deadlock. Gating it on `test` (or `pip-audit`) disarms the guard
    # whenever that cheaper stage is red — which is exactly when you most
    # want the freeze signal. Observed on PR #426: both CI runs skipped
    # tui-e2e because `test` was flaky, so a deadlock fix landed with the
    # deadlock guard never executed. PR #461 reduced that flake; it does
    # not make the structural dependency right.
    #
    # lint/type-check stay: they are cheap syntax gates and a broken
    # install is not a freeze. `test` and `pip-audit` do not: a flake or a
    # newly-published CVE must not skip the macOS resume-liveness
    # assertion. The job installs the package itself, so it does not need
    # those stages to have built anything. cli-sanity/server-sanity keep
    # the full `needs` list — they are live-LLM cost, not freeze guards.
    # What changed with scope gating: this job now also `needs: changes` and
    # carries the `tui` flag, whose predicate is deliberately EQUAL to `unit`.
    # Not laziness — `tests/e2e/test_fork_e2e.py` and
    # `test_mcp_failure_reaches_the_viewer_e2e.py` import `scripts.*`, so a
    # `scripts/` change is a tui-e2e input anyway, and gating the freeze guard
    # more finely than the unit matrix re-creates the #426 disarm in a new
    # costume: a flag narrow enough to skip the guard on a diff that could have
    # broken it.
    if: >-
      !cancelled() &&
      needs.changes.outputs.tui != 'false'
    # Generous relative to the ~11 s the stage takes when healthy (~14 s on a
    # macOS runner, which is slower and queues longer). The failure mode under
    # test is a hang, and each test carries its own tighter bound (see
    # tests/e2e/watchdog.py): the C timer dumps every thread's stacks with
    # `exit=False`, and a kernel-level SIGALRM ends the process a 5 s grace
    # later if the step is still wedged — a pre-fix red lands at bound + 5 s.
    # This ceiling is only the backstop for a hang that escapes both arms, so it
    # should never be what reports a freeze; it is sized to absorb macOS install
    # and queue time instead.
    #
    # NOT tightened now that the tree is sharded, deliberately. The split cut
    # the measured wall to a fraction of it, so this ceiling is now several
    # times the healthy cost — but the thing it exists to leave room for is NOT
    # the healthy cost: it is install + queue on a slow macOS runner, and a
    # genuine freeze is reported by the per-test bound (see
    # tests/e2e/watchdog.py, whose SIGALRM arm ends a run at that bound) long
    # before this fires. Tightening it toward the
    # measured wall would turn runner slowness into red shards without making a
    # real hang report any sooner. `tests/unit/test_ci_hygiene.py` pins the
    # relationship in the direction that matters: the ceiling must exceed every
    # shard wall the manifest projects.
    # 20 -> 22 on 2026-10-19, for the two-shard partition above: the heaviest
    # e2e leg projects 1165.8350s, so the guard's own minimum is
    # ceil((1165.8350 + 60)/60) = 21 minutes, and 22 leaves +94.1650s over
    # the 1200s budget at 21. A ceiling is not a reservation -- it is only
    # paid by a leg that is genuinely stuck -- and the e2e tree grows, so the
    # extra minute is cheaper here than a cancellation.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - name: Set Up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # `mcp` is a BASE dependency, so `.[dev]` is sufficient and this job does
      # not name it. If it ever becomes an extra, this install must name it
      # explicitly: without the SDK the manager short-circuits every server
      # with MCP_SDK_MISSING_ERROR, the connect never reaches the OAuth lock,
      # and the resume test would pass while exercising nothing at all.
      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Partition the e2e suite
        # Same partitioner as the unit matrix, pointed at the other tree: the
        # LPT split by measured per-file duration (tests/durations-e2e.json),
        # not by file count. `--total` must equal the matrix length above, and
        # tests/unit/test_ci_hygiene.py checks that coupling rather than
        # trusting it — an orphaned shard is a set of tests that never runs.
        #
        # The file list is written rather than passed through `$()` so the job
        # log records exactly which files ran in this shard, on this leg.
        run: |
          python scripts/shard_tests.py \
            --tree e2e --shard ${{ matrix.shard }} --total 2 --out e2e_tests.txt
      - name: Print the shard's file list
        # Cheap, and it is the difference between "a shard failed" and "which
        # tests were in it". Ordered as the partitioner ordered it.
        run: cat e2e_tests.txt
      - name: Run headless TUI end-to-end tests
        id: e2e_shard_pytest
        # `-m e2e` overrides the `-m "not e2e"` in pyproject's addopts, which
        # keeps this stage out of the unit run: `faulthandler`'s timer is
        # process-global, so under xdist a `bounded` block would take a worker's
        # stacks with it for the rest of the item. `-n0`: these contend real
        # flock lock files and drive whole app lifecycles, so they run serially
        # rather than under xdist.
        # `env -u NO_COLOR TERM=xterm-256color` is what the TUI suite needs to
        # compose a real frame, same as the documented local invocation.
        #
        # The file list is this shard's slice of tests/e2e, written by the
        # step above; `-m e2e` still applies, because the marker is added by
        # tests/e2e/conftest.py AT COLLECTION by path, so naming files
        # explicitly does not drop it.
        #
        # `--junit-xml` for the same reason the unit shards write one: it is
        # the only measurement of this tree taken on a runner rather than on a
        # loaded developer box, and regenerating tests/durations-e2e.json from
        # it costs one `gh run download` instead of a 20-minute local run.
        run: |
          env -u NO_COLOR TERM=xterm-256color \
            python -m pytest $(cat e2e_tests.txt | tr '\n' ' ') -m e2e -n0 -q \
              --junit-xml=junit-e2e-${{ matrix.os }}-${{ matrix.shard }}.xml
      - name: Darwin pin evidence (census + incident shape)
        id: darwin_pin
        # WHY THE DARWIN FILES LIVE IN THE TUI JOB: the sharded `test` job is
        # `runs-on: ubuntu-latest` only, so the one platform these two files exist
        # to measure -- macOS, where nobody had checked whether a group census
        # still lists an unreaped zombie leader -- would never run them in CI.
        # This is the only job with a macos runner, so the Darwin answer is
        # measured here or nowhere.
        #
        # ONE step for both files, deliberately: this job is the freeze guard, and
        # `tests/unit/test_ci_hygiene.py` allows it exactly one extra pytest
        # invocation beyond the partitioned e2e run. One command keeps that
        # invariant while still running both -- the probe proves the platform
        # REPORTS the corpse, the incident shape runs the consequence: a real child
        # that outlives its parent and a live grandchild that must be reclaimed.
        #
        # `-n0` because these fork and leave corpses on purpose. They FAIL rather
        # than skipping when the shape cannot be produced: a green skip would
        # defeat the measurement.
        if: matrix.os == 'macos-latest'
        timeout-minutes: 5
        run: >
          python -m pytest
          tests/unit/scripts/test_owned_process_group_zombie_probe.py
          tests/unit/scripts/test_run_bounded_incident_shape.py
          -n0 -q
      - name: Upload e2e junit timings
        # `if: always()` for the FAILING case: a shard that fails an assertion
        # exits 1 and still writes the XML, with times for every test that ran.
        #
        # `bounded` fails a hang on its own, in two steps: the C timer dumps
        # every thread's stacks (diagnostic only, `exit=False`), and a
        # kernel-level SIGALRM ends the process a 5 s grace later if the step is
        # still wedged. If instead the step returns after its dump, `bounded`
        # raises a regular TimeoutError and pytest writes this failure report.
        # The upload remains `always()` so ordinary assertion failures retain the
        # per-test timings used to correct shard weights.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-timings-e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: junit-e2e-${{ matrix.os }}-${{ matrix.shard }}.xml
          # 7 days, not 1: same post-hoc evidence rationale as the unit-shard
          # junit artifact (PR #2470: expired XML forced a full re-run).
          retention-days: 7
          if-no-files-found: ignore
      - name: Report a hang's thread dump
        # The dump this step prints is the DIAGNOSTIC half. A process still
        # wedged when its grace expired was ended by `bounded`'s own SIGALRM arm,
        # which is why this step is `always()` rather than `failure()`: for a
        # killed run the retained C-thread dump is the only report of the hang.
        # The job ceiling stays the backstop for anything that escapes both arms.
        # Safe after any failure: only files with faulthandler's `Timeout (` marker
        # are printed, so an ordinary assertion failure is never called a hang.
        if: always()
        run: python -m tests.e2e.watchdog

  # THE SECOND REQUIRED CHECK: nothing merges until the whole suite is green.
  #
  # Shape copied from ci.yml's `ci-gate` on purpose — one stable check name, an
  # `always()` aggregate over every job in its own workflow, fail-closed on
  # `failure`/`cancelled` and passing on `skipped` (a hygiene test compares the
  # two scripts). Splitting the two checks is what keeps review cheap: `CI Gate`
  # is the slim PR path, this is the one-time full run at the gate.
  #
  # NO EVENT GUARD, AND NO LABEL CONDITION — THOSE ARE THE ONLY SAFE SHAPES.
  #
  # GitHub counts a `skipped` job as SATISFYING a required status check, so any
  # `if:` that can be false on a run which publishes this job's check to the PR
  # head SHA is a merge hole. Both known holes are closed by plain `always()`:
  #
  # - The event guard this job used to carry
  #   (`always() && github.event_name == 'pull_request'`) skipped the gate on
  #   every non-PR event — and this workflow is DISPATCHED on PR branches, which
  #   is the documented `WIDE:` route. Measured on PR #3631's head: run
  #   42501880282 (a `workflow_dispatch` on the branch) left
  #   `Merge gate (full suite)` = `skipped` on the head while its own suite ran
  #   RED. Off `pull_request` every classifier flag is true (scripts/ci_scope.py),
  #   so such a run executed the whole suite and its verdict IS evidence for the
  #   SHA — worth publishing, never worth discarding in favour of a skip.
  # - A label condition (`contains(github.event.pull_request.labels.*.name,
  #   'ready-to-merge')`) would skip the gate on a run started by a DIFFERENT
  #   label — same hole, another door.
  #
  # So this is `if: always()`, exactly like ci.yml's `ci-gate`: every run of this
  # workflow publishes an honest verdict built from its OWN `needs`, whatever
  # started it. On `main` it turns the run red when any suite job is red, which
  # is the whole post-merge signal; on a branch dispatch it is the
  # real full-suite result. `labeled` is still the only PR trigger above, so the
  # gate intent cannot start a run this misses, and a mislabel spends a run
  # rather than manufacturing a pass. tests/unit/test_ci_hygiene.py pins both
  # halves: the `if:` here, and that NO job in this file carries a condition on
  # the triggering event or on the label.
  #
  # `if: always()` so it REPORTS even when a needed job died. A required check
  # that never reports is "Expected" forever and blocks a PR with no
  # explanation; this one always lands a verdict.
  #
  # `needs` must list every job above: one omitted job is a suite that runs, can
  # go red, and still passes the gate.
  merge-gate:
    name: Merge gate (full suite)
    if: always()
    needs:
      - changes
      - test
      - coverage-report
      - tui-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$bad" ]; then
            echo "::error title=Merge gate (full suite)::failed or cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
