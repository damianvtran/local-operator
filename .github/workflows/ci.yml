name: Pre-release CI Testing

on:
  push:
    branches:
      # ONLY `main` here, deliberately.
      #
      # `dev-*` used to be in this list as well, which double-billed every
      # feature branch: a `dev-*` branch with an open PR fired a `push` run AND
      # a `pull_request` run for the SAME commit, two identical sets of jobs
      # whose results nobody read twice. At one point 29 of the SHAs in the
      # queue were running both. The `pull_request` trigger below already
      # covers feature branches, so dropping `dev-*` here halves the per-commit
      # cost without reducing what is actually tested.
      #
      # A `dev-*` branch with NO open PR now gets no CI until the PR is opened.
      # That is the intended trade: CI exists to gate review and merge, and an
      # un-PR'd branch is gating nothing. Use `workflow_dispatch` to run it by
      # hand if you need a pre-PR signal.
      - main
  # PULL REQUESTS TOO. Without this a feature branch received NO CI until it
  # was already merged, which let a broken `pip install .` and an import that
  # fails on the declared minimum Python both reach review looking green.
  # Every gate below is worthless on a branch it never runs on.
  pull_request:
  workflow_dispatch:

# One in-flight run per ref. A review cycle force-pushes repeatedly, and
# without this every superseded push kept its full job set queued to completion
# against a 20-job account-wide concurrency cap — 56% of the active queue was
# once running against commits their own branch had already moved past, while
# the newest commit (the only one anybody was waiting on) sat behind them.
#
# `github.workflow` is in the key so this workflow never cancels a sibling
# workflow's run on the same ref (the release/publish line in particular).
#
# `github.ref` is the right granularity: for a `pull_request` event it is the
# PR's merge ref, so successive pushes to one PR supersede each other while
# two different PRs never collide.
#
# A push to `main` is never cancelled BY A LATER MERGE, and the SHA in the
# group key is how that is achieved. A push to `main` is a merge whose result
# is the release signal and the record for that commit, so every one of those
# runs must complete.
#
# The precise guarantee: no `main` run is cancelled or evicted by a run on a
# DIFFERENT commit. Two runs on the SAME `main` commit — a re-run, or a
# `workflow_dispatch` at a commit already building — do share a group and the
# later one supersedes the earlier. That is acceptable because the survivor is
# on the identical SHA and, not being a `pull_request`, runs the same full
# both-leg matrix: the CI record is replaced by an equivalent one rather than
# lost, which is also what a GitHub re-run does by design.
#
# `cancel-in-progress: false` alone would NOT deliver that. A concurrency group
# permits one run in progress and, by default, only ONE run pending: when a
# third arrives the waiting one is cancelled. With `main` merging faster than
# this workflow's ~23 min duration (four merges inside 27 minutes was observed
# while writing this), run A executes, B waits, C arrives and evicts B — and B
# is then a commit on `main` that no CI ever reported on.
#
# Adding `github.sha` for `main` gives every merge commit its OWN group, so
# `main` runs never contend and none can be cancelled or evicted. Feature
# branches keep a per-ref group, so successive pushes to one PR still supersede
# each other, which is where the throughput saving comes from.
#
# Why not `queue: max` (the documented way to hold up to 100 pending runs):
# GitHub rejects `queue: max` combined with a `cancel-in-progress` that can
# evaluate true, and this workflow needs cancellation on feature branches.
# Tried, and it failed the run at plan time with:
#   "The combination of 'queue: max' and 'cancel-in-progress: true'
#    is not allowed"
# A unique group per `main` commit reaches the same guarantee with keys that
# have been supported all along, and it does not queue `main` runs behind each
# other — they simply run.
#
# This matters specifically because the `test` matrix below runs the 3.13 leg
# ONLY on `main`. `main` is the safety net for the narrowed pull request
# matrix, so a hole in that net would undo the justification for narrowing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  # Classifies this diff and exposes one flag per job. The classifier
  # (`scripts/ci_scope.py`) is the SINGLE SOURCE OF TRUTH for both this job and
  # `make check-changed`, so the local gate and CI cannot drift into two
  # different opinions about which gates a diff needs.
  #
  # WHY THIS JOB CAN NEVER BE GATED ON THE EVENT: every heavy job now `needs:`
  # it, and a `needs:` on a skipped job skips the dependent too — an
  # `if: pull_request` here would skip the ENTIRE workflow on `push` to `main`.
  # The event is handled inside the module, which returns every flag TRUE for
  # anything but a `pull_request`.
  #
  # Reads the diff as `git diff HEAD^1 HEAD` — the RECOMPUTED
  # refs/pull/N/merge's first parent — NOT `github.event.pull_request.base.sha`,
  # for the reason measured in version-bump-guard below: a frozen base goes
  # stale the moment `main` moves and sweeps in commits this PR never wrote.
  # NOT `github.event.before` (zero SHA on a new branch, unreachable after a
  # force push).
  #
  # Runs the classifier from the BASE revision, never from the PR's copy: a PR
  # that edits the classifier must not be able to disarm the gates that classify
  # it. A base copy that is absent is not an error — fall back to the checked-in
  # copy in `--all` mode and warn.
  #
  # `--root "$GITHUB_WORKSPACE"` is passed EXPLICITLY, and that is not
  # decoration: the base copy is run from `$RUNNER_TEMP`, so a module that
  # inferred its repository from `__file__` would look for the checkout one
  # level above itself, `git diff` would exit 128, and the fail-open branch
  # would set every flag true on every pull request — the gate would be correct
  # and never engage. The module now also resolves its root from the git top
  # level of the invocation directory, so the two fixes are independent: this
  # flag keeps the workflow from depending on that resolution being right.
  #
  # The flags are strings 'true'/'false', and every gate reads `!= 'false'`
  # rather than `== 'true'`. That is load-bearing: an output that was never
  # written is EMPTY, `'' == 'true'` is false, and a classifier that died would
  # therefore produce a fully green PR that ran nothing. `!= 'false'` runs
  # everything it cannot prove is unnecessary.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.classify.outputs.lint }}
      types: ${{ steps.classify.outputs.types }}
      budget: ${{ steps.classify.outputs.budget }}
      unit: ${{ steps.classify.outputs.unit }}
      tui: ${{ steps.classify.outputs.tui }}
      windows: ${{ steps.classify.outputs.windows }}
      xplat: ${{ steps.classify.outputs.xplat }}
      audit: ${{ steps.classify.outputs.audit }}
      cli: ${{ steps.classify.outputs.cli }}
      server: ${{ steps.classify.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 must be present. Two commits is the whole requirement, as in
          # version-bump-guard.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Classify the change
        id: classify
        # No `pip install`: the classifier imports stdlib only, so a broken
        # dependency resolution can never decide what runs. Same argument as
        # version-bump-guard's "a guard that needs an install is a guard that
        # goes red for reasons unrelated to versions".
        run: |
          set -uo pipefail
          base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [ -n "$base" ] && git cat-file -e "$base:scripts/ci_scope.py" 2>/dev/null; then
            git show "$base:scripts/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
            python "$RUNNER_TEMP/ci_scope.py" \
              --event "$GITHUB_EVENT_NAME" --base "$base" \
              --root "$GITHUB_WORKSPACE" \
              --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Change classification unavailable::no classifier at the base commit, so this diff cannot be classified. Running every job rather than guessing."
            python scripts/ci_scope.py --all --root "$GITHUB_WORKSPACE" \
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
          fi

  # A feature PR must never carry a version bump. Releases are cut as ONE
  # deliberate `chore(release):` PR per window by that window's owner, so a
  # bump riding a feature diff silently consumes a version number that is
  # never tagged, never built and never published.
  #
  # This is not hypothetical and it is why the check is machine-checked rather
  # than left to review. Two feature PRs (#701, #706) each smuggled a bump, so
  # `main` advertised 0.50.2 while the newest tag, GitHub Release and PyPI
  # artifact were all still 0.50.0: 0.50.1 and 0.50.2 were burned, and anyone
  # reading pyproject.toml got a version PyPI had never heard of. The v0.50.3
  # window had to skip both numbers, because two artifacts believing they are
  # the same version is unrecoverable once published.
  #
  # AGENTS.md already stated the rule AND told reviewers to treat a version
  # change in a feature PR as a finding. Both review rounds passed anyway. The
  # defect was that the rule existed only in prose, so it depended on each
  # reviewer remembering to look; this job is that rule with teeth.
  #
  # PR-only: a `push` run on `main` has no PR title to read, and by then the
  # commit is already in. The release PR is exempted by its conventional-commit
  # title, which is the same string the release procedure already requires.
  version-bump-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits is all the diff below needs, but the checkout is the
          # `refs/pull/N/merge` commit, so HEAD^1 (the base side) and HEAD^2
          # (the PR side) must both be present.
          fetch-depth: 2

      - name: Reject a version bump outside a release PR
        env:
          # Read through the environment rather than interpolated into the
          # script: a PR title is attacker-controlled text, and inlining it
          # directly would let a crafted title inject shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # `HEAD^1 HEAD` and NOT a three-dot diff against
          # `github.event.pull_request.base.sha`. Actions checks out the
          # RECOMPUTED `refs/pull/N/merge`, whose first parent is the base
          # branch as of this run, while `base.sha` is frozen when the event
          # fires. Once `main` moves, the frozen SHA becomes an ancestor of
          # HEAD, `merge-base` returns it unchanged, and the three-dot form
          # silently degrades to two-dot — sweeping in every version bump
          # `main` itself landed in the meantime and failing an innocent PR
          # for a diff it never wrote. Measured on the six PRs before this
          # one, `base.sha` was already stale for four of them (#700, #704,
          # #706, #708), and it goes stale precisely during the busy release
          # window this guard exists to protect. The first person failed by a
          # version diff they did not write is the person who disables the
          # guard.
          #
          # The merge commit's own diff against its base parent is exactly
          # "what this PR would introduce", which is the question being asked.
          diff=$(git diff HEAD^1 HEAD -- pyproject.toml)
          # Not `|| true` on the grep: that discards git's exit status too, so
          # a failed diff would report "no version change" and the guard would
          # fail OPEN on a head that carries a real bump. grep's own "no
          # match" is exit 1 and must stay non-fatal, so the two are separated.
          changed=$(printf '%s\n' "$diff" | { grep -E '^[+-]version[[:space:]]*=' || true; })
          if [ -z "$changed" ]; then
            # A release PR that changes NOTHING is the mirror-image failure,
            # and it is the more dangerous direction. The feature-PR case below
            # burns a number nobody released; this one ships the PREVIOUS
            # release's CODE under a new number, so
            # `pip install local-operator==X.Y.Z` delivers the version before
            # it, and the tag, the Release and PyPI all agree with each other
            # about the wrong tree.
            #
            # It was nearly shipped as v0.50.4. The owner amended the bump onto
            # a DETACHED HEAD, so the branch ref never followed the amend, and
            # every signal said it had worked: `push --force-with-lease`
            # reported success (honestly — nothing needed overwriting, so the
            # lease was never violated), the retitle and un-draft applied
            # because PR metadata is independent of the ref, CI went green, and
            # THIS JOB PASSED through the early exit below. Four green signals
            # on a broken state, because each answered a question about a
            # different object than the one being released.
            case "$PR_TITLE" in
              'chore(release): bump version to '*)
                echo "::error file=pyproject.toml::A release PR must actually change the version."
                echo "This PR is titled '$PR_TITLE' but its diff does not touch"
                echo "the version line in pyproject.toml, so the release would carry"
                echo "the previous version's code under a new number."
                echo
                echo "The usual cause is an amend made on a detached HEAD: the branch"
                echo "ref never moved, and --force-with-lease still reports success"
                echo "because nothing needed overwriting. Check what the FORGE has,"
                echo "not what your local clone has:"
                echo "  gh pr view <n> --json headRefOid --jq .headRefOid"
                echo "  git show <that-sha>:pyproject.toml | grep '^version'"
                exit 1
                ;;
            esac
            echo "No version change in pyproject.toml."
            exit 0
          fi
          case "$PR_TITLE" in
            'chore(release):'*)
              echo "Release PR, version change allowed:"
              echo "$changed"
              # The new version must sort ABOVE the highest existing release
              # tag. A published version cannot be corrected: PyPI refuses to
              # reuse a filename even after a yank, and a number that sorts
              # below what a source installer already holds means
              # `pip install -U` silently declines to move them onto the real
              # release. Numbers consumed by an unreleased in-PR bump are
              # skipped, never reused.
              #
              # The tag comes from `ls-remote`, NOT `git describe`, and that is
              # load-bearing rather than a preference. `actions/checkout@v7`
              # passes `--no-tags` unless `fetch-tags: true` (its default is
              # false — v7.0.1 still declares `fetch-tags: false` and
              # `fetch-depth: 1`, so the v4-to-v7 bump above changed none of
              # what follows), so this shallow checkout carries ZERO tags and
              # `git describe` exits 128 on every real run — a first draft of
              # this check used it and was dead code that passed a backward
              # bump green. `fetch-tags: true` does not fix it either: at
              # depth 2 the tag object arrives but is not REACHABLE in the
              # truncated history, so `describe` still fails whenever the base
              # has moved past the tag, which is the normal state during a
              # release window. `ls-remote` asks the forge instead of the local
              # object store, in one network call, and needs no history at all.
              #
              # It is therefore the highest tag REPO-WIDE rather than the
              # newest reachable one. That is the stricter reading and the
              # right one here: a release must be forward of everything ever
              # published, not merely of its own ancestry.
              new=$(printf '%s\n' "$changed" \
                | sed -n 's/^+version[[:space:]]*=[[:space:]]*["'"'"']\{0,1\}\([0-9][^"'"'"' 	]*\).*/\1/p')
              if [ -z "$new" ]; then
                echo "::error file=pyproject.toml::Could not parse the new version."
                echo "The diff adds a version line this job cannot read:"
                printf '%s\n' "$changed"
                echo "Expected: version = \"X.Y.Z\". Fix the line, or update this"
                echo "job if the project's version syntax has genuinely changed;"
                echo "an unparsable version must never pass unchecked."
                exit 1
              fi
              last=$(git ls-remote --tags --refs origin 'v[0-9]*' \
                | sed 's#.*refs/tags/v##' | sort -V | tail -1)
              if [ -n "$last" ]; then
                highest=$(printf '%s\n%s\n' "$new" "$last" | sort -V | tail -1)
                if [ "$new" = "$last" ] || [ "$highest" != "$new" ]; then
                  echo "::error file=pyproject.toml::Release version must be above the highest tag."
                  echo "New version '$new' does not sort above the highest release tag 'v$last'."
                  echo "A published version cannot be corrected, so pick the next unused"
                  echo "number above v$last rather than reusing or rewinding one."
                  exit 1
                fi
                echo "Version $new sorts above the highest release tag v$last."
              else
                echo "No release tags found on the remote; skipping the ordering check."
              fi
              ;;
            *)
              echo "::error file=pyproject.toml::A feature PR must not change the project version."
              echo "This PR changes the version line in pyproject.toml:"
              echo "$changed"
              echo
              echo "Versions are bumped only by a dedicated release PR whose title"
              echo "starts with 'chore(release):', cut by the release window owner."
              echo "Drop the bump from this branch; pyproject.toml stays at the last"
              echo "released version on every feature branch."
              exit 1
              ;;
          esac

  lint:
    # Every gate below is `needs: [changes]` plus `!cancelled() && <flag> != 'false'`.
    # `!cancelled()` is required rather than decorative: GitHub applies an
    # implicit `success()` to any `if:` containing no status-check function,
    # and a SKIPPED dependency skips its dependents — so without it, a job this
    # diff deliberately skips would still run (or, worse, skip) its own
    # dependents. The `!= 'false'` comparison is the fail-open half: only the
    # literal string `false` skips, so an output that was never written runs
    # the job.
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.lint != 'false'
    runs-on: ubuntu-latest
    # Generous against the ~30 s this takes; it exists so a wedged install step
    # cannot hold a concurrency slot for the 360-minute GitHub default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # The pip cache is why this job does not pay a cold dependency
          # install on every run. `cache-dependency-path` is load-bearing: the
          # default key hashes no lockfile here (there is none), so without it
          # the cache would be keyed on nothing and never hit.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0 black==26.1.0 isort==5.13.2

      - name: Run flake8
        run: flake8 .

      - name: Run black
        run: black --check .

      - name: Run isort
        run: isort --check .

  type-check:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.types != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pyright's version is the pin in pyproject.toml's dev extra. Do NOT
    # set PYRIGHT_PYTHON_FORCE_VERSION: that env var makes the wrapper
    # ignore the bundled analyzer and download whatever npm currently
    # calls latest, which is how this job drifted onto 1.1.413 while the
    # package (and every local run) stayed on 1.1.411. Bump the pin, not
    # an env override.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pyright
        run: pyright

      - name: Verify browser extension protocol sync
        # Main CI owns this too: a Python-only protocol edit must fail even if
        # the paths-gated extension workflow does not run.
        run: python -m local_operator.browser_bridge.gen_ts --check
        
  context-budget:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.budget != 'false'
    # Guards the start-of-session context contract in docs/REWRITE.md. It
    # builds the real tool surface and renders the real prompt blocks, then
    # fails when a fresh session's start context exceeds the ratchet in
    # scripts/bench_context_budget.py.
    #
    # Its own job, deliberately, and NOT gated on `test`: this is the only
    # thing that notices context creeping upward, and a flaky unit run must
    # not disarm it. It needs no API key and no secrets, so it runs on forks
    # too. Cheap — an import and some string building, no model call.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Check start-of-session context budget
        run: python scripts/bench_context_budget.py --verbose

  filesystem-boundaries-windows:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.windows != 'false'
    # Canonical containment must use native Windows drive/junction semantics,
    # not a POSIX test with os.name mocked. Keep this bounded to the HTTP/import
    # contract rather than claiming the complete interactive suite is portable.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify native filesystem boundaries
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP "lop-boundary-home"
          $env:USERPROFILE = $env:HOME
          $env:LOCAL_OPERATOR_CONFIG_DIR = Join-Path $env:HOME ".local-operator"
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          python -m pytest tests/unit/test_agent_import_boundary.py tests/unit/server/test_edit_workspace_boundary.py -n0 -q

  # The cross-platform probe battery (`scripts/xplat_probe.py`), one leg per OS.
  #
  # WHY THIS IS NOT COVERED BY THE UNIT MATRIX: the suite runs on Linux and the
  # interactive surface is exercised on macOS, so a mechanism that is silently
  # POSIX-only -- or silently macOS-only -- passes every other gate in this
  # file. The failure class it targets is the SILENT one: not an `ImportError`
  # at startup, which somebody would notice, but a code path that reports
  # success and does nothing on this platform (the measured baseline was
  # `wake.install` and `mobile.install` both FAILing on Linux -- "no supervisor
  # installer for this platform" and "install needs macOS launchd" -- while
  # `mobile.status` still answered, i.e. the portal looked present and could not
  # be installed).
  #
  # The battery is stdlib-only, self-driving and isolated (it re-homes HOME and
  # the config root into a scratch sandbox, and strips inherited `CMUX_*`), so
  # these legs need no pytest, no fixtures, no secrets and no network -- and
  # therefore run on fork pull requests. It exits non-zero when any probe
  # FAILed, which is what makes this a gate rather than a report: the matrix it
  # prints is the failure message.
  #
  # Two jobs rather than one `os:` matrix, because they share no step bodies:
  # the Windows leg is PowerShell end to end (see below) and carries the longer
  # ceiling. `fail-fast` is therefore not in play here -- neither leg can cancel
  # the other.
  #
  # WHAT THIS CANNOT COVER, and why it is a separate rig: one GitHub runner is
  # one Ubuntu LTS, while `lop`'s Linux mechanisms (a user systemd instance,
  # `notify-send`, `xdg-open`, the terminal it was launched from) are exactly
  # what a distro changes. Other distributions are read through
  # `scripts/xplat_linux_matrix.sh`, which builds containers locally -- a
  # container cannot be a GitHub runner. Windows is the reverse case: a Windows
  # container needs a Windows kernel underneath it and cannot run on a macOS or
  # Linux host at all, so Windows validation is this real Windows runner and
  # never an emulation container.
  xplat-probe-linux:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.xplat != 'false'
    runs-on: ubuntu-latest
    # The battery bounds each probe itself (60-600 s, a timed-out probe is a
    # reported FAIL, not a hang), so this is only the backstop for install and
    # queue time. A wedged install must not hold a concurrency slot for the
    # 360-minute default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the cross-platform probe battery
        # The console script is deliberately not used: the probes invoke the
        # entry point through the interpreter so a host with the package
        # present but no installed shim is still measurable (the same reason the
        # battery's own `_cli_argv` exists), and this line is the reading the
        # `--json` artifact records.
        run: python scripts/xplat_probe.py --json xplat-ubuntu.json

      - name: Upload the probe matrix
        # `always()`: the JSON is most worth having on the run that FAILed, and
        # a battery that dies mid-way still writes the probes that completed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xplat-probe-linux
          path: xplat-ubuntu.json
          retention-days: 7

  xplat-probe-windows:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.xplat != 'false'
    # Native Windows, not a container and not a simulated `os.name`: the probes
    # that matter here are the ones where Windows differs in substance
    # (`os.startfile`, `socket.SO_EXCLUSIVEADDRUSE`, `signal.SIGBREAK` via
    # `CTRL_BREAK_EVENT`, `%USERPROFILE%` rather than `$HOME`, no module-level
    # `fcntl`/`pty`, a non-POSIX file lock). A POSIX host with `os.name` patched
    # cannot answer any of them.
    runs-on: windows-latest
    # Longer than the Linux leg on purpose: the same battery on a slower runner
    # with slower installs, and one probe may legitimately spend its 600 s
    # importing every module in the package before reporting.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the cross-platform probe battery
        shell: pwsh
        run: |
          # Same sandbox shape as `filesystem-boundaries-windows`, and for the
          # same reason: a probe that reads the runner's real profile is
          # measuring the machine, not the code. `USERPROFILE` is not decoration
          # -- it, not `HOME`, is what `os.path.expanduser` consults on Windows,
          # so a sandbox that sets only `HOME` leaves the real profile live.
          $env:HOME = Join-Path $env:RUNNER_TEMP "lop-xplat-home"
          $env:USERPROFILE = $env:HOME
          $env:LOCAL_OPERATOR_CONFIG_DIR = Join-Path $env:HOME ".local-operator"
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          python scripts/xplat_probe.py --json xplat-windows.json

      - name: Upload the probe matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xplat-probe-windows
          path: xplat-windows.json
          retention-days: 7

  test:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.unit != 'false'
    runs-on: ubuntu-latest
    # Keep five shards within the 20-job concurrency budget. PR #643 job
    # 101250352578 reached 97% before GitHub cancelled it at the 15-minute
    # limit, so allow 20 minutes for setup and the long tail without dropping
    # tests, coverage, or the independent per-test/e2e watchdogs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # BOTH ends of `requires-python` on `main`, the minimum only on pull
        # requests.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}
        shard: [0, 1, 2, 3, 4]
    env:
      # Seconds of no completed test before the controller reports which tests
      # are still in flight, and the per-item bound after which a worker dumps
      # every thread's stacks. Four shards have been cancelled at the 20-minute
      # cap after a silent 6-minute tail (5m55s-7m18s of zero output) which the
      # log cannot attribute: `-q` prints one line per 72 completed tests, so
      # the last partial line is withheld until its slowest item finishes.
      #
      # 240s is chosen against measurements, not taste. This budget is a CI
      # number, as AGENTS.md requires: the worst legitimate test measured in a
      # full local run is 81s, and a shard averages ~0.2s per completed test, so
      # four minutes with NO completion is already anomalous rather than slow.
      # It also has to fire with time to spare before the cap: the observed
      # stalls begin ~14 minutes into the job, so 240s puts the first report at
      # ~18 minutes with the 30s repeat getting at least one more before 20.
      LOCAL_OPERATOR_SHARD_STALL_SECONDS: "240"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Partition test suite
        # Balanced by MEASURED per-file duration (tests/durations.json), not by
        # sort position. The old `i % 5` split balanced the file COUNT, which in
        # a suite whose per-file cost spans four orders of magnitude produced a
        # 4.16x spread: the heaviest shard projected 81.7 test-min against 19.6
        # for the lightest, and ran 19.2 min against this job's 20-minute cap.
        #
        # Worse, the index was positional, so adding ONE test file re-dealt
        # every later file and the slow cluster MIGRATED between shards. A PR
        # adding one file was reported as a failure with `3693 passed` in its
        # log (cancelled at the cap), while one adding six files finished in
        # 8m46s. Risk was uncorrelated with what the author did.
        #
        # `--dist worksteal` in addopts cannot fix this: it rebalances within
        # one pytest process, and this split happens across five machines
        # before pytest starts. The full reasoning, the determinism argument,
        # and why a file missing from the manifest still runs are in
        # scripts/shard_tests.py.
        run: |
          python scripts/shard_tests.py \
            --shard ${{ matrix.shard }} --total 5 --out shard_tests.txt

      - name: Run test shard with coverage
        run: |
          pytest $(cat shard_tests.txt | tr '\n' ' ') --cov --cov-fail-under=0 --cov-report= \
            --junit-xml=junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml
          mv .coverage .coverage.${{ matrix.python-version }}.${{ matrix.shard }}

      - name: Upload junit timings
        # WHY THE SUITE PAYS FOR A JUNIT FILE EVERY RUN: this is the only
        # channel that turns committed shard weights into MEASURED ones on
        # dedicated hardware. `tests/durations.json` is currently measured on a
        # developer machine, whose load distorts the event-loop-bound TUI files
        # that carry 82% of the tree's weight (scripts/gen_test_durations.py
        # says so and names CI as the better source, blocked only because the
        # workflow emitted nothing to read). With this artifact,
        # `gh run download <run> -n junit-timings-<py>-*` then
        # `python scripts/gen_test_durations.py --tree unit --junit '*.xml'`
        # regenerates the manifest from the run that actually suffered the
        # imbalance — no local full-suite run needed.
        #
        # `if: always()` is deliberate, and its reach is narrower than it looks.
        # It covers the FAILING case: an ordinary pytest failure exits 1 and
        # still writes the XML, with `failures="1"` and per-test times for
        # everything that ran, which is a run whose weights want correcting.
        #
        # It does NOT cover the case this job actually cares about: a shard
        # killed by the `faulthandler` watchdog (tests/e2e/watchdog.py exits
        # with `os._exit(1)`) never reaches pytest's `sessionfinish`, and that
        # is where the JUnit file is written -- so there is no file to upload,
        # and `if-no-files-found: ignore` means the step reports success with
        # an empty artifact. Measured both ways on 2026-09-19: a failing test
        # leaves `failures="1"` in the XML, while a test that calls
        # `os._exit(1)` (what the watchdog does) leaves no XML at all.
        #
        # Cancellation is deliberately NOT claimed either way. It is a third
        # exit path this change did not measure, and the two signals differ: a
        # round-2 review measured that SIGINT (which is how GitHub's
        # documented cancellation begins) leaves the XML, while SIGTERM does
        # not. The two cases above are what this rationale rests on.
        # A hung shard's timings are therefore NOT recoverable from this
        # artifact; the weights for such a run come from a healthy one.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-timings-${{ matrix.python-version }}-${{ matrix.shard }}
          path: junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Print the shard stall report
        # `always()` unconditionally: the report exists exactly when this job is
        # cancelled at the cap or dies, and `always()` is the one condition that
        # still runs then. It is belt-and-braces rather than the delivery path
        # -- the controller prints its report straight to this log while the
        # stall is happening, because that is the only channel a cancelled job
        # leaves intact -- but it also covers a device-level failure nothing
        # printed, and a fired worker stack dump in the case where the shard
        # step failed rather than timed out.
        #
        # The printing is done by the module (`report_dumps`), not by `cat`, and
        # that is load-bearing rather than cosmetic: a worker writes its header
        # at ARM time, one per test, so a raw dump of this PR's own cancelled
        # shard held 3088 lines all reading "<nodeid> exceeded 240s" with the
        # one real timeout buried among them. The module's FIRED_MARKER filter
        # is the single source of truth for "this is evidence", so the step asks
        # for the filtered report instead of re-implementing the rule in YAML.
        if: always()
        run: |
          python -m tests.shard_stall_watchdog "${TMPDIR:-/tmp}/lo-shard-stall"

      - name: Upload shard coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.python-version }}.${{ matrix.shard }}
          retention-days: 1
          include-hidden-files: true

  # `coverage-report` is deliberately left with `needs: test` and NO `if:`, and
  # that is the whole disposition — do not add `always()` for symmetry with the
  # gated jobs above. GitHub's default ("a skipped need skips the dependent") is
  # exactly right here: a docs-only PR must not run a coverage combine over
  # zero shard artifacts. An `always()` would do precisely that and go red on a
  # PR that changed nothing the test job reads.
  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-${{ matrix.python-version }}-*
          merge-multiple: true

      - name: Combine coverage and check threshold
        run: |
          ls -la
          coverage combine .coverage.${{ matrix.python-version }}.*
          coverage report --fail-under=80
          coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov
          retention-days: 7

  pip-audit:
    needs: [changes]
    if: >-
      !cancelled() &&
      needs.changes.outputs.audit != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install package
        run: python -m pip install .
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .
  cli-sanity:
    runs-on: ubuntu-latest
    # Live-LLM job: needs a real OpenRouter key. Fork pull requests do not get
    # repository secrets, so without the fork half of this condition every
    # external contributor sees a permanently red check they cannot fix. The
    # fork clause is PRESERVED by ANDing the scope flag onto it, not replaced by
    # it — a rewrite that dropped it would restore exactly that permanent red.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.cli != 'false' &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.test.result == 'success' &&
      needs.pip-audit.result == 'success'
    # The `.result == 'success'` clauses restore what the implicit `success()`
    # used to provide: a FAILED cheaper gate still blocks this one. A
    # deliberately SKIPPED one does not, which is the point of the change — and
    # `pip-audit` can only be skipped on a diff where `audit` is false, which
    # also makes `cli` false, so this job is skipped by its own flag first. No
    # PERMISSIVE_DEPS pair is needed (see scripts/ci_scope.py).
    needs:
      - changes
      - lint
      - type-check
      - test
      - pip-audit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set Up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Deliberately the bare default install, with no extras: this job is the
      # regression guard that the core agent still runs on the lean dependency
      # set. Do not add extras here to fix a failure — fix the lazy import.
      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run CLI Sanity Test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Run CLI to create test file
          # --yolo: the sanity run is sandboxed CI; the rewritten harness denies
          # approval-gated tools (write) without a tty unless auto-approved.
          #
          # MODEL CHOICE: these live-LLM jobs assert that a small, cheap model
          # can still drive the agent end to end, so the model has to emit real
          # structured tool calls rather than describe them.
          #
          # SERVING CAPACITY IS PART OF THE CHOICE, not just price and
          # tool-calling. The previous pick (qwen/qwen3.7-flash) tool-called
          # perfectly and still made this job intermittently red: OpenRouter
          # lists exactly ONE endpoint for it (Alibaba), so when that single
          # upstream saturates the job dies with
          #   HTTP 429 ... Alibaba returned error: qwen/qwen3.7-flash is
          #   temporarily rate-limited upstream
          # and test.txt is never written. Observed on runs 34188298919 and
          # 34184908064 (cli-sanity, main) and 34189747430 attempt 1
          # (server-sanity, /v1/chat 500s), all of which passed on retry --
          # which is the signature of upstream capacity, not of a defect in the
          # PR under test. Retrying is not the fix; a model whose serving is not
          # one shared bottleneck is.
          #
          # openai/gpt-oss-20b is served by 14 providers on OpenRouter (9 of
          # them tool-capable: CoreWeave, DeepInfra, Fireworks, Groq, Parasail,
          # Darkbloom, ...), so a saturated provider degrades to another one
          # instead of 429ing the run. Measured locally against these exact
          # commands: 10/10 on the --yolo write task, 5/5 on the --json
          # streaming contract, p50 4.0s (vs 7.8s for qwen), and ~$0.00034 per
          # run at 11.1k prompt / 67 completion tokens -- cheaper per run than
          # the model it replaces (~$0.00046) at the same $0.030/$0.130 per
          # Mtok. Rejected: google/gemini-2.5-flash-lite (2/10 -- mid-stream
          # finish_reason 'error'), amazon/nova-micro-v1 and openai/gpt-5-nano
          # (both clean but fewer providers and dearer per run).
          #
          # If this starts failing, FIRST separate the two failure modes: a
          # 429/5xx naming one upstream provider is capacity (re-check how many
          # endpoints OpenRouter still lists for this model), while tool-call
          # markup appearing as assistant TEXT is a model regression -- the
          # shape that made deepseek/deepseek-v4-flash-0731 write nothing at
          # 0/5. Re-measure candidates before swapping; a model that cannot
          # tool-call makes these jobs permanently red and teaches everyone to
          # ignore them. Any replacement must support `tools`, be served by
          # more than one provider, and be verified against both the --yolo
          # write task and the --json streaming contract.
          local-operator --hosting openrouter --model openai/gpt-oss-20b exec --yolo "create a file called test.txt with the text 'hello world' in it" || exit 1

          # Check if file exists and contains correct text
          if [ ! -f test.txt ]; then
            echo "test.txt was not created"
            exit 1
          fi

          if ! grep -q "hello world" test.txt; then
            echo "test.txt does not contain expected text"
            cat test.txt
            exit 1
          fi

          echo "CLI sanity test passed successfully"

      # The `exec --json` event stream is a CONTRACT with the TUI, the server
      # websocket and any external consumer, and stdout is its data channel.
      # This gate exists because the checker previously lived in the repo
      # unwired: a working detector sitting beside the defect it detects proves
      # nothing. `--json` is the point — the job above deliberately runs
      # without it, so only this step can catch prose on stdout.
      - name: Run Streaming Contract Check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          local-operator --hosting openrouter --model openai/gpt-oss-20b \
            --yolo exec --json "create a file called contract.txt containing ok" \
            > run.jsonl 2> run.err || exit 1
          python scripts/check_streaming_contract.py run.jsonl || {
            echo "--- stdout that failed the contract ---"; cat run.jsonl; exit 1; }

      # The error paths are the ones that regressed historically: a missing key
      # or a bad model printed a coloured banner to stdout, so a consumer broke
      # at exactly the moment it needed to read the failure. Assert stdout is
      # EMPTY (or JSON) while the diagnosis lands on stderr.
      - name: Assert Error Paths Keep stdout Clean
        run: |
          set +e
          env -u OPENROUTER_API_KEY local-operator --hosting openrouter \
            --model openai/gpt-oss-20b exec --json "hi" > err_out.jsonl 2> err_err.txt
          set -e
          if [ -s err_out.jsonl ]; then
            # `|| [ -n "$line" ]`: bash read returns non-zero at EOF on an
            # UNTERMINATED final line, so without this the loop body never runs
            # for it and the gate passes on exactly the shape it exists to
            # catch — a diagnostic written with end='' or a stream truncated
            # mid-write by a signal.
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              echo "$line" | python -c 'import json,sys; json.loads(sys.stdin.read())' || {
                echo "non-JSON on stdout from a failing exec --json run:"; echo "$line"; exit 1; }
            done < err_out.jsonl
          fi
          test -s err_err.txt || { echo "expected a diagnostic on stderr"; exit 1; }
          echo "error-path stdout is clean"

  tui-e2e:
    needs: [changes, lint, type-check]
    # `!cancelled()` is required, not decoration: `needs` skips a job when a
    # needed job was SKIPPED, and GitHub applies an implicit `success()` to any
    # `if` that contains no status-check function. Without it, lint's deliberate
    # skip on an inert diff would skip the freeze guard — the #426 defect in a
    # new costume. The explicit `.result == 'success'` clauses restore the other
    # half: a FAILED lint or type-check still blocks this job.
    #
    # BOTH platforms, and macOS is the one that makes this job worth having.
    #
    # This job exists because a FULLY GREEN unit suite did not catch a total
    # event-loop freeze. PR #401 fixed a deadlock in the MCP OAuth refresh
    # lock: an unbounded blocking `fcntl.flock` on a worker thread, then
    # `os.close(fd)` on the event-loop thread during cancellation. 8000+ unit
    # tests passed throughout, because every piece was individually correct and
    # NOTHING drove the assembled application. This stage drives it.
    #
    # The deadlock is a macOS/BSD property: `close()` blocks there while a
    # sibling thread is parked in `flock()` on that descriptor, and on Linux it
    # simply returns. That is measured, not assumed — the same probe reports
    # `close_blocked=True` on darwin and `close_blocked=False` (7.4 us) on
    # linux. Running the resume test against the PRE-FIX tree (80df237b^) in
    # `python:3.12-slim` gives `1 passed`, RC=0: the regression test passes
    # against the regression. Sampling `sys._current_frames()` through that run
    # catches the worker parked in `_lock_exclusive`, so the lock IS contended
    # on Linux and the cancellation does happen — the loop just never wedges.
    #
    # So an ubuntu-only wiring would have shipped this stage green against the
    # very commit it was built to catch. macOS is therefore not a nice-to-have
    # leg: it is the only platform where the freeze guard can go red at all.
    # Linux stays because the rest of the stage is genuinely platform-neutral
    # (boot, the write-turn artifacts, the transcript replay and the
    # interactivity assertion) and it is the faster, always-available runner.
    #
    # `fail-fast: false` so a macOS queue delay or a Linux-only regression each
    # report on their own rather than cancelling the other leg's evidence.
    #
    # TWO axes, and each one answers a different requirement.
    #
    # `os` is the guard's own requirement: macOS is the only platform where the
    # #401 event-loop freeze can go red at all (see the long note above), so
    # dropping the leg disarms the stage. Both OSes run every shard.
    #
    # `shard` is how this stage stopped being the longest job in the run. The
    # whole tree ran serially on each leg — `-n0` is required (a fired watchdog
    # kills the process, which under xdist takes unrelated tests with it) — and
    # measured `184 passed, 7 skipped ... in 1111.95s` on run 35414372114: 19.1
    # and 19.8 min, the critical path of the entire workflow. Splitting the
    # TREE across RUNNERS is the one axis that leaves the `-n0` requirement
    # untouched: each matrix leg is its own machine, with its own process, its
    # own `flock` files and its own app lifecycles, so no shard can see a
    # sibling's hang.
    #
    # WHY THREE AND NOT TWO, and what the trade is. Measured on run 35420676112
    # (the split from CI-measured timings): legs of 414/412/401 s on ubuntu and
    # 442/441/400 s on macOS, i.e. ~7.5 min per leg including install, against a
    # unit shard whose job wall is ~12-15 min. So the e2e job is NO LONGER the
    # critical path at three shards, and two shards (~11 min per leg) would also
    # finish first. Three buys earlier freeze-guard feedback on a tree that only
    # grows, and costs two more jobs per run: this matrix takes a pull request
    # from 17 jobs to 21, against the ~20-job account-wide budget the `test`
    # job's comment names, on main from 20 to 24. That is a deliberate trade,
    # not an oversight: if runner queue pressure becomes the binding constraint,
    # `shard: [0, 1]` with `--total 2` restores the job count at the same
    # critical path — which is why the matrix and `--total` are asserted equal
    # in tests/unit/test_ci_hygiene.py rather than kept in sync by hand.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    # NO fork gate, deliberately, unlike cli-sanity/server-sanity below. Those
    # need a real OpenRouter key, so they are skipped on fork PRs that cannot
    # have one. This job is scripted end to end — no key, no network, no model
    # — so it runs on every pull request whose diff is NOT INERT, forks included.
    # It still carries no fork gate; what changed with scope gating is only that
    # a diff touching nothing but `docs/**` (or the mobile-web subproject) does
    # not run it — and because the matrix includes macOS, a fork contributor
    # reintroducing the deadlock sees it go red on their own PR on the macOS
    # leg. Both halves are load-bearing: a secrets-gated job could not reach
    # forks at all, and a Linux-only job would reach them and report green.
    #
    # Headless in the sense this job depends on: no display server, no window
    # and no `xvfb`. Most of the stage drives Textual's `run_test()` pilot into
    # an in-memory compositor, and the rest (`test_terminal_close_survives_e2e`,
    # `test_tui_boot_e2e`) allocates its own pty and drives the real console
    # script — so the runner still supplies no terminal, and this must never
    # grow a real browser or display dependency.
    #
    # lint + type-check only. This job is the freeze regression guard (#401);
    # it exists BECAUSE a green unit suite did not catch a total event-loop
    # deadlock. Gating it on `test` (or `pip-audit`) disarms the guard
    # whenever that cheaper stage is red — which is exactly when you most
    # want the freeze signal. Observed on PR #426: both CI runs skipped
    # tui-e2e because `test` was flaky, so a deadlock fix landed with the
    # deadlock guard never executed. PR #461 reduced that flake; it does
    # not make the structural dependency right.
    #
    # lint/type-check stay: they are cheap syntax gates and a broken
    # install is not a freeze. `test` and `pip-audit` do not: a flake or a
    # newly-published CVE must not skip the macOS resume-liveness
    # assertion. The job installs the package itself, so it does not need
    # those stages to have built anything. cli-sanity/server-sanity keep
    # the full `needs` list — they are live-LLM cost, not freeze guards.
    # What changed with scope gating: this job now also `needs: changes` and
    # carries the `tui` flag, whose predicate is deliberately EQUAL to `unit`.
    # Not laziness — `tests/e2e/test_fork_e2e.py` and
    # `test_mcp_failure_reaches_the_viewer_e2e.py` import `scripts.*`, so a
    # `scripts/` change is a tui-e2e input anyway, and gating the freeze guard
    # more finely than the unit matrix re-creates the #426 disarm in a new
    # costume: a flag narrow enough to skip the guard on a diff that could have
    # broken it.
    if: >-
      !cancelled() &&
      needs.changes.outputs.tui != 'false' &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success'
    # Generous relative to the ~11 s the stage takes when healthy (~14 s on a
    # macOS runner, which is slower and queues longer). The failure mode under
    # test is a hang, and each test carries its own tighter `faulthandler`
    # bound (see tests/e2e/watchdog.py) that fires first with a full thread
    # dump — a pre-fix red lands in ~63 s. This ceiling is only the backstop
    # for a hang that escapes those, so it should never be what reports a
    # freeze; it is sized to absorb macOS install and queue time instead.
    #
    # NOT tightened now that the tree is sharded, deliberately. The split cut
    # the measured wall to a fraction of it, so this ceiling is now several
    # times the healthy cost — but the thing it exists to leave room for is NOT
    # the healthy cost: it is install + queue on a slow macOS runner, and a
    # genuine freeze is reported by the per-test `faulthandler` bound (see
    # tests/e2e/watchdog.py) long before this fires. Tightening it toward the
    # measured wall would turn runner slowness into red shards without making a
    # real hang report any sooner. `tests/unit/test_ci_hygiene.py` pins the
    # relationship in the direction that matters: the ceiling must exceed every
    # shard wall the manifest projects.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set Up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # `mcp` is a BASE dependency, so `.[dev]` is sufficient and this job does
      # not name it. If it ever becomes an extra, this install must name it
      # explicitly: without the SDK the manager short-circuits every server
      # with MCP_SDK_MISSING_ERROR, the connect never reaches the OAuth lock,
      # and the resume test would pass while exercising nothing at all.
      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Partition the e2e suite
        # Same partitioner as the unit matrix, pointed at the other tree: the
        # LPT split by measured per-file duration (tests/durations-e2e.json),
        # not by file count. `--total` must equal the matrix length above, and
        # tests/unit/test_ci_hygiene.py checks that coupling rather than
        # trusting it — an orphaned shard is a set of tests that never runs.
        #
        # The file list is written rather than passed through `$()` so the job
        # log records exactly which files ran in this shard, on this leg.
        run: |
          python scripts/shard_tests.py \
            --tree e2e --shard ${{ matrix.shard }} --total 3 --out e2e_tests.txt
      - name: Print the shard's file list
        # Cheap, and it is the difference between "a shard failed" and "which
        # tests were in it". Ordered as the partitioner ordered it.
        run: cat e2e_tests.txt
      - name: Run headless TUI end-to-end tests
        # `-m e2e` overrides the `-m "not e2e"` in pyproject's addopts, which
        # keeps this stage out of the unit run (a fired watchdog exits the
        # process, which under xdist would kill a worker carrying unrelated
        # tests). `-n0`: these contend real flock lock files and drive whole
        # app lifecycles, so they run serially rather than under xdist.
        # `env -u NO_COLOR TERM=xterm-256color` is what the TUI suite needs to
        # compose a real frame, same as the documented local invocation.
        #
        # The file list is this shard's slice of tests/e2e, written by the
        # step above; `-m e2e` still applies, because the marker is added by
        # tests/e2e/conftest.py AT COLLECTION by path, so naming files
        # explicitly does not drop it.
        #
        # `--junit-xml` for the same reason the unit shards write one: it is
        # the only measurement of this tree taken on a runner rather than on a
        # loaded developer box, and regenerating tests/durations-e2e.json from
        # it costs one `gh run download` instead of a 20-minute local run.
        run: |
          env -u NO_COLOR TERM=xterm-256color \
            python -m pytest $(cat e2e_tests.txt | tr '\n' ' ') -m e2e -n0 -q \
              --junit-xml=junit-e2e-${{ matrix.os }}-${{ matrix.shard }}.xml
      - name: Upload e2e junit timings
        # `if: always()` for the FAILING case: a shard that fails an assertion
        # exits 1 and still writes the XML, with times for every test that ran.
        #
        # NOT for a hang. A tripped watchdog calls `os._exit(1)`, so pytest
        # never reaches `sessionfinish` and writes nothing -- and
        # `if-no-files-found: ignore` then reports this step as a success with
        # no artifact, which is how that limit would otherwise go unnoticed.
        # Measured both ways on 2026-09-19 (see the sibling note on the unit
        # job's upload step).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-timings-e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: junit-e2e-${{ matrix.os }}-${{ matrix.shard }}.xml
          retention-days: 1
          if-no-files-found: ignore
      - name: Report a hang's thread dump
        # A tripped watchdog kills the process, so pytest never gets to print
        # anything: the stacks of the parked threads live only in a dump file,
        # and without this step a freeze reports as a bare non-zero exit.
        #
        # Safe to run after ANY failure. A dump file survives only when a bound
        # actually fired (every ordinary exit path removes its own), and only
        # files carrying faulthandler's `Timeout (` marker are printed — so an
        # ordinary assertion failure gets an explicit "not a hang" line rather
        # than a fabricated timeout claim for a test that failed in seconds.
        if: failure()
        run: python -m tests.e2e.watchdog

  server-sanity:
    needs: [changes, lint, type-check, test, pip-audit]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.server != 'false' &&
      needs.lint.result == 'success' &&
      needs.type-check.result == 'success' &&
      needs.test.result == 'success' &&
      needs.pip-audit.result == 'success'
    runs-on: ubuntu-latest
    # Live-LLM job — same fork-secret gate as cli-sanity, preserved the same way.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set Up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Package in Editable Mode
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server]"
      - name: Start Server and Check Functionality
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Start the server in the background
          local-operator serve --port 8080 &
          SERVER_PID=$!

          # Wait for server to start up and check health (timeout after 30s)
          for i in {1..30}; do
            RESPONSE=$(curl -s http://localhost:8080/health || true)
            if echo "$RESPONSE" | grep -i '"status":200' > /dev/null && echo "$RESPONSE" | grep -i '"message":"ok"' > /dev/null; then
              echo "Server is healthy after $i seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to become healthy after 30 seconds. Last response:"
              echo "$RESPONSE"
              kill $SERVER_PID
              exit 1
            fi
            sleep 1
          done

          # Test chat endpoint with OpenRouter model
          RESPONSE=$(curl -s -X POST http://localhost:8080/v1/chat \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "create a file called test.txt with the text '\''hello world'\'' in it",
              "hosting": "openrouter",
              "model": "openai/gpt-oss-20b",
              "context": [],
              "options": {
                "temperature": 0.7,
                "top_p": 0.9
              }
            }')

          # Check if file exists and contains correct text
          if [ ! -f test.txt ]; then
            echo "test.txt was not created"
            kill $SERVER_PID
            exit 1
          fi

          if ! grep -q "hello world" test.txt; then
            echo "test.txt does not contain expected text"
            cat test.txt
            kill $SERVER_PID
            exit 1
          fi

          echo "Server sanity test passed successfully"

          # Clean up
          kill $SERVER_PID
