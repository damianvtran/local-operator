name: Cold owner bounded diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
# TEMPORARY NON-PR DIAGNOSTIC BRANCH ONLY. Never merge this workflow replacement.
# It runs selected neighbours or collection-only context, never the unit suite.
jobs:
  cold-owner-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the same development dependencies as unit CI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Materialize read-only span instrumentation
        run: |
          root="$RUNNER_TEMP/busy-owner-${GITHUB_RUN_ID}"
          mkdir -p "$root"
          cat > "$root/busy_trace.py" <<'PY'
          """Read-only pytest timing instrumentation for the cold-owner acquisition."""
          import asyncio
          import functools
          import json
          import time
          import os
          from pathlib import Path
          import contextvars

          _MEASURING = contextvars.ContextVar('busy_measurement', default=False)

          _SPANS = []
          _START = None


          def pytest_configure(config):
              from local_operator.server.utils.desktop_sessions import DesktopSessionBridge
              from local_operator.session.attached import AttachedSession

              original_to_thread = asyncio.to_thread
              async def measured_to_thread(func, /, *args, **kwargs):
                  if not _MEASURING.get():
                      return await original_to_thread(func, *args, **kwargs)
                  queued = time.perf_counter()
                  def execute():
                      started = time.perf_counter()
                      cpu = time.thread_time()
                      try:
                          return func(*args, **kwargs)
                      finally:
                          _SPANS.append({'span': 'executor:' + getattr(func, '__qualname__', type(func).__name__),
                                         'queue_ms': round((started-queued)*1000, 3),
                                         'wall_ms': round((time.perf_counter()-started)*1000, 3),
                                         'thread_cpu_ms': round((time.thread_time()-cpu)*1000, 3)})
                  return await original_to_thread(execute)
              asyncio.to_thread = measured_to_thread

              def wrap(cls, name):
                  original = getattr(cls, name)
                  @functools.wraps(original)
                  async def measured(*args, **kwargs):
                      start = time.perf_counter()
                      cpu = time.thread_time()
                      token = _MEASURING.set(True) if name == 'acquire' else None
                      try:
                          return await original(*args, **kwargs)
                      finally:
                          if token is not None:
                              _MEASURING.reset(token)
                          _SPANS.append({"span": cls.__name__ + "." + name,
                                         "wall_ms": round((time.perf_counter()-start)*1000, 3),
                                         "thread_cpu_ms": round((time.thread_time()-cpu)*1000, 3)})
                  setattr(cls, name, measured)

              for cls, names in [(DesktopSessionBridge, ["_ensure_facade", "acquire"]),
                                 (AttachedSession, ["_synthesise_cold_state", "_load_history", "_restore_cold_details", "attach_existing", "_dial"])]:
                  for name in names:
                      wrap(cls, name)


          def pytest_runtest_setup(item):
              global _START
              _SPANS.clear()
              _START = time.perf_counter()


          def pytest_runtest_teardown(item):
              result = {"test": item.name, "spans": _SPANS,
                        "whole_test_ms": round((time.perf_counter()-_START)*1000, 3)}
              print("BUSY_TRACE " + json.dumps(result))
              output = os.environ.get('BUSY_TRACE_DIR')
              if output:
                  target = Path(output)
                  target.mkdir(parents=True, exist_ok=True)
                  with (target / (str(os.getpid()) + '.jsonl')).open('a') as handle:
                      handle.write(json.dumps(result) + '\n')
          PY
      - name: Run bounded targeted Linux controls
        shell: bash
        run: |
          root="$RUNNER_TEMP/busy-owner-${GITHUB_RUN_ID}"
          git rev-parse HEAD > "$root/revision.txt"
          python -c 'import platform,os; print(platform.platform(), "cpus", os.cpu_count())' > "$root/host.txt"
          python scripts/shard_tests.py --shard 3 --total 5 --out "$root/shard3.txt"
          overall=0
          for cell in direct-n0 direct-n4 neighbours-n4 collection-n4; do
            iso=$(mktemp -d "$root/iso-${cell}.XXXXXX")
            mkdir -p "$root/$cell"
            case "$cell" in
              direct-n0) workers=0; selection='busy_owner_is_painted or healthy_owner_lands_inside'; files=(tests/unit/server/test_desktop_read_without_owner.py);;
              direct-n4) workers=4; selection='busy_owner_is_painted or healthy_owner_lands_inside'; files=(tests/unit/server/test_desktop_read_without_owner.py);;
              neighbours-n4) workers=4; selection=''; files=(tests/unit/server/test_desktop_read_without_owner.py);;
              collection-n4) workers=4; selection='test_a_busy_owner_is_painted_cold_at_once_and_goes_live_behind_it'; mapfile -t files < "$root/shard3.txt";;
            esac
            args=()
            if [ -n "$selection" ]; then args=(-k "$selection"); fi
            # env-i removes CMUX/LOP, credentials and operator state. Explicit
            # -n4 matches the main failing Linux job; each invocation is bounded.
            env -i CI=true HOME="$iso" TMPDIR="$iso" LOCAL_OPERATOR_CONFIG_DIR="$iso/config"               PATH="$PATH" TERM=xterm-256color PYTHONPATH="$root:$GITHUB_WORKSPACE" BUSY_TRACE_DIR="$root/$cell"               python scripts/run_bounded.py --timeout 180 --grace 3 -- python -m pytest               "${files[@]}" "${args[@]}" -p busy_trace -q -s -n"$workers"               --cov=local_operator --cov-report= --cov-fail-under=0               > "$root/$cell.log" 2>&1 && rc=0 || rc=$?
            echo "$cell rc=$rc" | tee -a "$root/results.txt"
            tail -12 "$root/$cell.log"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"
      - name: Preserve diagnostic evidence even on a reproduced failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: busy-owner-linux-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/busy-owner-${{ github.run_id }}/revision.txt
            ${{ runner.temp }}/busy-owner-${{ github.run_id }}/host.txt
            ${{ runner.temp }}/busy-owner-${{ github.run_id }}/results.txt
            ${{ runner.temp }}/busy-owner-${{ github.run_id }}/*.log
            ${{ runner.temp }}/busy-owner-${{ github.run_id }}/*/*.jsonl
          retention-days: 3
      - name: Clean only this job's owned probe roots
        if: always()
        run: rm -rf "$RUNNER_TEMP/busy-owner-${GITHUB_RUN_ID}"
