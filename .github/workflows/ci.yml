name: CORE2450 one native diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-e134:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Existing CI dependency set only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Two native cases with unchanged authority guards
        env:
          MESH_DIAG_OUT: ${{ runner.temp }}/mesh-e134-guard.jsonl
        run: python scripts/mesh_merge_diagnostic.py
      - name: Publish scrubbed bounded structural diagnosis only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-e134-structural-diagnosis
          path: ${{ runner.temp }}/mesh-e134-guard.jsonl
          if-no-files-found: error
          retention-days: 7
