# DIAGNOSTIC CARRIER ONLY — NEVER MERGE, TAG, RELEASE OR COUNT AS PRODUCT CI.
# Replacing this branch's normal entrypoint prevents PR/push fan-out. Reuse the
# existing workflow id: a new workflow absent on default main cannot dispatch.
name: Gate notice lifecycle diagnostic — NEVER MERGE
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Only after independent review and manager approval: TRACE ONLY"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gate-notice-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization == 'TRACE ONLY' && startsWith(github.ref, 'refs/heads/diag/gate-notice-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare pinned sources and one shared non-editable environment
        run: |
          set -euo pipefail
          export GATE_DIAG_WORK="$RUNNER_TEMP/gate-diag"
          mkdir -p "$GATE_DIAG_WORK/artifacts"
          git fetch --no-tags origin 318f23af220592c16fcdb66d8faa096b04c7c521 b42471d3935cb7e95d64428af27c32626665f4c0
          git worktree add --detach "$GATE_DIAG_WORK/current" 318f23af220592c16fcdb66d8faa096b04c7c521
          git worktree add --detach "$GATE_DIAG_WORK/base" b42471d3935cb7e95d64428af27c32626665f4c0
          python -m venv "$GATE_DIAG_WORK/venv"
          "$GATE_DIAG_WORK/venv/bin/python" -m pip install "$GATE_DIAG_WORK/current[all,dev]"
          "$GATE_DIAG_WORK/venv/bin/python" -m pip freeze > "$GATE_DIAG_WORK/artifacts/dependencies.txt"
      - name: Calibrate observers and reject a deliberately missing instrument
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gate-diag/venv/bin/python" scripts/diagnostics/gate_notice/run.py calibrate --work "$RUNNER_TEMP/gate-diag"
      - name: One bounded module lane per pinned source — no retries
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gate-diag/venv/bin/python" scripts/diagnostics/gate_notice/run.py run --work "$RUNNER_TEMP/gate-diag"
      - name: Persist diagnostics even after test or setup failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-notice-never-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-diag/artifacts
          if-no-files-found: error
          retention-days: 7
