# SCRATCH DRAFT ONLY. Never merge this diagnostic branch. E01 owns publication/dispatch.
# Replaces ONLY .github/workflows/ci.yml on the dedicated diagnostic branch.
name: DIAGNOSTIC ONLY — gate 43265391359 Python 3.13.18
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: diagnostic-43265391359-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic_original_merge:
    name: Diagnostic original merge — two serial nodes (NOT full gate)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diag/gate-43265391359-py31318' &&
      github.repository == 'damianvtran/local-operator'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - name: Initialize diagnostic receipts (not a gate)
      shell: bash
      env:
        RECIPE_MANIFEST_B64: 
        CI_CONSTRAINTS_B64: 
      run: |
        set -euo pipefail
        E="$RUNNER_TEMP/g432-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$E"
        echo "E=$E" >> "$GITHUB_ENV"
        python3 - <<'PY'
        import base64, os, pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/('g432-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
        for key,name in [('RECIPE_MANIFEST_B64','source-manifest.json'),('CI_CONSTRAINTS_B64','observed-ci-constraints.txt')]:
            (root/name).write_bytes(base64.b64decode(os.environ[key]))
        PY
        printf 'ImageOS=%s\nImageVersion=%s\nRunnerOS=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_OS" > "$E/runner-image.txt"
    - name: Checkout immutable original merge parent
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: b4740a43b0d3866e77078542a1fb8900a335ef8c
        fetch-depth: 0
        persist-credentials: false
    - name: Reconstruct and check out EXACT original ephemeral merge
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = b4740a43b0d3866e77078542a1fb8900a335ef8c
        git cat-file -e be6b46c3a0999d9b3adf2a5ce6ed79a051a3003c^{commit}
        env GIT_AUTHOR_DATE='1794509951 +0000' GIT_COMMITTER_DATE='1794509951 +0000' \
          git -c user.name='full-suite gate' -c user.email='full-suite-gate@invalid' \
          merge --no-ff --no-edit --quiet -m 'full-suite gate: merge be6b46c3a0999d9b3adf2a5ce6ed79a051a3003c into b4740a43b0d3866e77078542a1fb8900a335ef8c' be6b46c3a0999d9b3adf2a5ce6ed79a051a3003c
        test "$(git rev-parse HEAD)" = 2f279328d7445183d7533a5ad4d04177839ecd56
        test "$(git rev-parse HEAD^{tree})" = 1ceda5df72d0a3acba335c39282e93befd81d7a4
        test "$(git rev-parse HEAD^1)" = b4740a43b0d3866e77078542a1fb8900a335ef8c
        test "$(git rev-parse HEAD^2)" = be6b46c3a0999d9b3adf2a5ce6ed79a051a3003c
        git checkout --quiet --detach 2f279328d7445183d7533a5ad4d04177839ecd56
        git diff --exit-code
        git diff --cached --exit-code
        git ls-tree -r --full-tree HEAD > "$E/full-source-tree.txt"
        git cat-file commit 2f279328d7445183d7533a5ad4d04177839ecd56 > "$E/exact-commit.txt"
        printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$E/source-identity.txt"
    - name: Set up exact original Python 3.13.18
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.13.18
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install and verify observed original CI version constraints
      id: deps
      shell: bash
      timeout-minutes: 5
      run: |
        set -euo pipefail
        python - <<'PY'
        import sys
        assert sys.version_info[:3] == (3,13,18), sys.version
        PY
        PRIVATE_PIP_DIR="$RUNNER_TEMP/private-g432-pip-${{ github.run_id }}-${{ github.run_attempt }}"
        mkdir -p "$PRIVATE_PIP_DIR"
        export PRIVATE_PIP_DIR
        set +e
        (
          set -e
          python -m pip install pip==26.3
          python -m pip install --constraint "$E/observed-ci-constraints.txt" --report "$PRIVATE_PIP_DIR/report.json" -e ".[dev]"
          python -m pip check
        ) 2>&1 | tee "$PRIVATE_PIP_DIR/install.log"
        install_rc=${PIPESTATUS[0]}
        set -e
        python - <<'PY'
        import json, os, pathlib, re
        root=pathlib.Path(os.environ['E']); private=pathlib.Path(os.environ['PRIVATE_PIP_DIR'])
        text=(private/'install.log').read_text(errors='replace')
        text=re.sub(r'https?://[^\s\x1b]+','[URL OMITTED]',text)
        text=re.sub(r'(?i)bearer\s+[^\s]+','Bearer [REDACTED]',text)
        (root/'pip-install-sanitized.log').write_text(text)
        report=private/'report.json'
        if report.exists():
            original=json.loads(report.read_text()); rows=[]
            for item in original.get('install',[]):
                metadata=item.get('metadata',{}); archive=item.get('download_info',{}).get('archive_info',{})
                rows.append({'name':metadata.get('name'),'version':metadata.get('version'),'archive_hashes':archive.get('hashes',{})})
            (root/'pip-artifact-provenance.json').write_text(json.dumps({'schema':'sanitized-pip-provenance/v1','distributions':rows},indent=2)+'\n')
        PY
        if [ "$install_rc" -ne 0 ]; then exit "$install_rc"; fi
        python - <<'PY'
        import importlib.metadata as md, json, os, pathlib, sys
        root=pathlib.Path(os.environ['E']); m=json.loads((root/'source-manifest.json').read_text())
        wrong={}
        for name,want in m['dependencies']['observed_installed_versions'].items():
            try: got=md.version(name)
            except md.PackageNotFoundError: got=None
            if got != want: wrong[name]={'want':want,'got':got}
        (root/'dependency-verification.json').write_text(json.dumps({'python':sys.version,'mismatches':wrong},indent=2)+'\n')
        (root/'installed-distributions.json').write_text(json.dumps(sorted([{'name':d.metadata['Name'],'version':d.version} for d in md.distributions()],key=lambda d:d['name'].lower()),indent=2)+'\n')
        if wrong: raise SystemExit('Observed CI dependency mismatch; no fallback: '+str(wrong))
        import local_operator
        assert pathlib.Path(local_operator.__file__).resolve()==(pathlib.Path.cwd()/'local_operator/__init__.py').resolve(), local_operator.__file__
        PY
    - name: 'Single serial node: runnerexit (120 seconds)'
      id: runnerexit
      continue-on-error: true
      shell: bash
      timeout-minutes: 3
      run: |
        set -uo pipefail
        D="$E/runnerexit"
        mkdir -p "$D/home" "$D/runtime"
        chmod 700 "$D/runtime"
        PY="$(command -v python)"
        set +e
        timeout --signal=TERM --kill-after=5s 120s env -i \
          HOME="$D/home" LOCAL_OPERATOR_CONFIG_DIR="$D/home/.local-operator" \
          LOCAL_OPERATOR_SCRATCHPAD="$D/receipts" XDG_RUNTIME_DIR="$D/runtime" \
          PATH="$PATH" TERM=xterm-256color CI=true PYTHONNOUSERSITE=1 \
          PYTHONDONTWRITEBYTECODE=1 LOCAL_OPERATOR_NO_NOTIFICATIONS=1 COVERAGE_FILE="$D/.coverage" \
          "$PY" -B -m pytest 'tests/unit/scripts/test_run_bounded_incident_shape.py::test_the_incident_shape_is_reclaimed_and_the_record_shows_the_pin' \
          -n0 -q -p no:cacheprovider -p tests.ci_order_owned_first \
          --cov --cov-fail-under=0 --cov-report= -o tmp_path_retention_policy=all \
          --basetemp="$D/tmp" --junitxml="$D/junit.xml" 2>&1 | tee "$D/pytest.log"
        rc=${PIPESTATUS[0]}
        printf '%s\n' "$rc" > "$D/exit-code.txt"
        exit "$rc"
    - name: 'Single serial node: backgroundattach (120 seconds)'
      id: backgroundattach
      continue-on-error: true
      shell: bash
      timeout-minutes: 3
      run: |
        set -uo pipefail
        D="$E/backgroundattach"
        mkdir -p "$D/home" "$D/runtime"
        chmod 700 "$D/runtime"
        PY="$(command -v python)"
        set +e
        timeout --signal=TERM --kill-after=5s 120s env -i \
          HOME="$D/home" LOCAL_OPERATOR_CONFIG_DIR="$D/home/.local-operator" \
          LOCAL_OPERATOR_SCRATCHPAD="$D/receipts" XDG_RUNTIME_DIR="$D/runtime" \
          PATH="$PATH" TERM=xterm-256color CI=true PYTHONNOUSERSITE=1 \
          PYTHONDONTWRITEBYTECODE=1 LOCAL_OPERATOR_NO_NOTIFICATIONS=1 COVERAGE_FILE="$D/.coverage" \
          "$PY" -B -m pytest 'tests/unit/tui/test_background_completion_notify.py::test_a_non_complete_session_says_its_state_rather_than_its_last_reply[error-Stopped with an error]' \
          -n0 -q -p no:cacheprovider -p tests.ci_order_owned_first \
          --cov --cov-fail-under=0 --cov-report= -o tmp_path_retention_policy=all \
          --basetemp="$D/tmp" --junitxml="$D/junit.xml" 2>&1 | tee "$D/pytest.log"
        rc=${PIPESTATUS[0]}
        printf '%s\n' "$rc" > "$D/exit-code.txt"
        exit "$rc"
    - name: Record honest single-node outcomes (not a merge gate)
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, os, pathlib, xml.etree.ElementTree as ET
        root=pathlib.Path(os.environ['E']); result={}; ok=True
        for lane in ('runnerexit','backgroundattach'):
            folder=root/lane; rcfile=folder/'exit-code.txt'; junit=folder/'junit.xml'
            row={'executed':rcfile.exists(),'exit_code':int(rcfile.read_text()) if rcfile.exists() else None,'junit_exists':junit.exists()}
            if junit.exists():
                cases=list(ET.parse(junit).getroot().iter('testcase'))
                row.update(testcase_count=len(cases),skipped=sum(len(c.findall('skipped')) for c in cases),failures=sum(len(c.findall('failure'))+len(c.findall('error')) for c in cases))
            passed=row['exit_code']==0 and row.get('testcase_count')==1 and row.get('skipped')==0 and row.get('failures')==0
            row['target_pass']=passed; result[lane]=row; ok=ok and passed
        (root/'summary.json').write_text(json.dumps(result,indent=2)+'\n')
        print(json.dumps(result,indent=2))
        if not ok: raise SystemExit('Diagnostic target failed, was skipped, or did not run; inspect artifacts. NOT a full gate.')
        PY
        git diff --exit-code
        git diff --cached --exit-code
    - name: Upload bounded diagnostic evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: diagnostic-43265391359-py31318-${{ github.run_id }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: error
        path: |-
          ${{ env.E }}/*.json
          ${{ env.E }}/*.txt
          ${{ env.E }}/*.log
          ${{ env.E }}/*/pytest.log
          ${{ env.E }}/*/exit-code.txt
          ${{ env.E }}/*/junit.xml
          ${{ env.E }}/**/run-bounded-runs/*.json
          ${{ env.E }}/**/*.exit.json
          ${{ env.E }}/**/*.spawn.json
