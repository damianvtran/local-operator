name: Chrome Web Store staged release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build and submit
        required: true
        default: main
      version:
        description: Expected extension manifest/package version
        required: true

permissions:
  contents: read
  id-token: write
  # `actions: read` is what verify-release-environment.sh needs for the two
  # endpoints it still calls: GET environments/{env} and its
  # deployment-branch-policies (both answer 200 with
  # x-accepted-github-permissions: actions=read).
  #
  # It is NOT sufficient for the environment-variables endpoint, which the
  # script used to call and no longer does. That endpoint demands
  # `environments=read`, which is not a permission a workflow token can be
  # granted — a probe job with `permissions: write-all` still gets 403. The
  # variable-scope invariant is proved by the preflight job below instead. Do
  # not "fix" a future 403 there by adding scopes; there is no scope to add.
  actions: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  # Runs deliberately OUTSIDE the environment. A variable defined at repository
  # or organization scope is readable by any job, so it would resolve non-empty
  # here; an environment-scoped one resolves empty. Blocking `stage` on this is
  # what keeps a repo-scoped variable — settable without passing the
  # environment's main-only branch policy — from steering a release.
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Deliberately NOT `inputs.ref`: this job runs the verifier itself, so it
      # takes the dispatch ref (which carries this reviewed YAML) rather than
      # the ref under release, so a dispatch cannot point the verifier at its
      # own script while building something else. `stage` builds `inputs.ref`
      # and gates it on its own ancestry check.
      #
      # Precisely: the dispatch ref controls this YAML and the verifier
      # together, so this is not by itself a defence against a rogue branch —
      # the environment's main-only deployment branch policy is what refuses
      # that, verified live (probe run 33794252670 was rejected with
      # `Branch "dev-store-verify-403" is not allowed to deploy`).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require release variables to be environment-scoped only
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          extension/scripts/verify-release-environment.sh --assert-unscoped-empty \
            CWS_PUBLISHER_ID "$CWS_PUBLISHER_ID" \
            CWS_EXTENSION_ID "$CWS_EXTENSION_ID" \
            GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" \
            CWS_SERVICE_ACCOUNT "$CWS_SERVICE_ACCOUNT"

  stage:
    needs: preflight
    runs-on: ubuntu-latest
    # The environment scopes the release variables and the main-only deployment
    # branch policy; its former required-reviewer gate was removed by operator
    # decision on 2026-09-03 so a store release runs end to end automatically.
    # The launch decision now rides on the reviewed-merge-to-main process,
    # enforced by the WIF attribute condition pinning refs/heads/main and the
    # ancestry check below. Uploading creates the store draft and submission, so
    # only reviewed commits on main may reach the token-bearing upload client.
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require a release commit from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # With no human approval gate on the environment, this ancestry check
          # and the WIF attribute condition pinning refs/heads/main are what keep
          # arbitrary branch code away from the credentials: only reviewed commits
          # already on main may run the build and the token-bearing upload client.
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::the selected ref must resolve to a commit on main"
            exit 1
          }
          echo "Building reviewed commit $(git rev-parse HEAD)"
      - name: Verify protected environment configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          extension/scripts/verify-release-environment.sh chrome-web-store \
            CWS_PUBLISHER_ID "$CWS_PUBLISHER_ID" \
            CWS_EXTENSION_ID "$CWS_EXTENSION_ID" \
            GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" \
            CWS_SERVICE_ACCOUNT "$CWS_SERVICE_ACCOUNT"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile
      - name: Build and validate the exact store package
        working-directory: extension
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm build:zip
          bash scripts/validate-store-zip.sh local-operator-extension.zip "$EXPECTED_VERSION"
      - name: Authenticate without a service-account key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for staged publication
        working-directory: extension
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: bash scripts/chrome-web-store.sh stage local-operator-extension.zip "$EXPECTED_VERSION"
